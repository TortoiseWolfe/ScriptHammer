      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">LaneToggle</text>
      <a href="#us-001" transform="translate(140, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-006" transform="translate(202, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-006</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Two audiences, one catalog. Services for</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">businesses, products for developers.</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">No duplicated underlying items.</text>
    </g>
    <g transform="translate(480, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">PricingCard</text>
      <a href="#us-001" transform="translate(140, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-002" transform="translate(202, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-002</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Price is read from the catalog, never from</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">the card. A submitted amount is discarded,</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">not validated — rejecting it leaks the price.</text>
    </g>
    <g transform="translate(940, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Recurring plans</text>
      <a href="#us-005" transform="translate(160, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-005</text></a>
      <a href="#fr-005" transform="translate(222, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-005</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Plan identifiers resolve from the catalog.</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Cancellation stops maintenance, not hosting</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">— stated here, before payment.</text>
    </g>
    <g transform="translate(1400, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">BookingCta</text>
      <a href="#us-006" transform="translate(140, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-006</text></a>
      <a href="#fr-024" transform="translate(202, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-024</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Records one conversation, then redirects.</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">No form in front of the click. Unconverted</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">calls stay visible to the operator.</text>
    </g>
    <g transform="translate(20, 130)">
      <text x="0" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b5563" letter-spacing="1">WHAT SHIPS</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">New route src/app/pricing/page.tsx — public, renders with no payment provider configured (FR-027).</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Components PricingTable / PricingCard / LaneToggle / BookingCta, each 5-file per the generator.</text>
      <text x="0" y="84" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Reads src/lib/commerce/catalog.ts. Buy actions route to /checkout?sku= — a real URL, not a drawer.</text>
    </g>
  </g>
  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">050:01 | Pricing Storefront (/pricing) | ScriptHammer</text>
