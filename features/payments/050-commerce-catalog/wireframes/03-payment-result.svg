<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/>
      <stop offset="100%" stop-color="#b8d4f0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">ORDER CONFIRMATION - /payment-result</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-desktop.svg#desktop-header" x="0" y="0"/>

    <text x="640" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#1f2937">You're all set</text>
    <text x="640" y="128" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#374151">A receipt is on its way to rigo@warriorroofing.example</text>

    <!-- Order card -->
    <rect x="300" y="156" width="680" height="182" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="328" y="186" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Landing Page</text>
    <rect x="828" y="170" width="124" height="26" rx="13" fill="#22c55e"/>
    <text x="890" y="188" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">PAID</text>
    <text x="328" y="216" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Order o_7fd2c1a4</text>
    <text x="952" y="216" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">$1,200.00</text>
    <line x1="328" y1="234" x2="952" y2="234" stroke="#b8a080"/>
    <text x="328" y="262" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Warrior Roofing Inc — warriorroofingtn.com</text>
    <text x="328" y="286" font-family="system-ui, sans-serif" font-size="14" fill="#374151">4 files received, tagged have and want.</text>
    <text x="328" y="314" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">Status advances only when the provider confirms, never on this redirect alone.</text>

    <!-- Primary CTA: booking -->
    <rect x="380" y="378" width="520" height="52" rx="6" fill="#8b5cf6"/>
    <text x="640" y="410" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8d4b8">Book your kickoff call — 30 min</text>
    <text x="640" y="454" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Opens your scheduler with name and email already filled.</text>
    <text x="640" y="478" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">A plain link — no third-party script loads on this page.</text>

    <!-- Secondary -->
    <rect x="380" y="510" width="250" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="505" y="538" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">View your orders</text>
    <rect x="650" y="510" width="250" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="775" y="538" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Download receipt</text>

    <use href="includes/footer-desktop.svg#site-footer" x="0" y="640"/>

    <g class="callout"><circle cx="270" cy="186" r="14" fill="#dc2626"/><text x="270" y="191" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text></g>
    <g class="callout"><circle cx="1010" cy="183" r="14" fill="#dc2626"/><text x="1010" y="188" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text></g>
    <g class="callout"><circle cx="930" cy="404" r="14" fill="#dc2626"/><text x="930" y="409" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text></g>
    <g class="callout"><circle cx="930" cy="532" r="14" fill="#dc2626"/><text x="930" y="537" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text></g>
  </g>

  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-mobile.svg#mobile-header-group" x="0" y="0"/>

    <text x="180" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1f2937">You're all set</text>
    <text x="180" y="138" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Receipt on its way.</text>

    <rect x="16" y="160" width="328" height="160" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="36" y="188" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Landing Page</text>
    <rect x="212" y="172" width="112" height="26" rx="13" fill="#22c55e"/>
    <text x="268" y="190" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">PAID</text>
    <text x="36" y="218" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Order o_7fd2c1a4</text>
    <text x="324" y="218" text-anchor="end" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">$1,200.00</text>
    <text x="36" y="248" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Warrior Roofing Inc</text>
    <text x="36" y="272" font-family="system-ui, sans-serif" font-size="14" fill="#374151">warriorroofingtn.com</text>
    <text x="36" y="300" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">4 files received.</text>

    <rect x="36" y="344" width="288" height="52" rx="6" fill="#8b5cf6"/>
    <text x="180" y="376" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8d4b8">Book your kickoff call</text>
    <text x="180" y="422" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Prefilled. A plain link, so</text>
    <text x="180" y="444" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#374151">nothing extra loads here.</text>

    <rect x="36" y="474" width="288" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="180" y="502" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">View your orders</text>
    <rect x="36" y="530" width="288" height="44" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="180" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Download receipt</text>

    <use href="includes/footer-mobile.svg#mobile-bottom-nav" x="0" y="664"/>

    <g class="callout"><circle cx="332" cy="248" r="11" fill="#dc2626"/><text x="332" y="253" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text></g>
    <g class="callout"><circle cx="332" cy="370" r="11" fill="#dc2626"/><text x="332" y="375" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text></g>
  </g>

  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <g transform="translate(20, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">What was bought</text>
      <a href="#us-001" transform="translate(180, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <a href="#fr-008" transform="translate(242, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-008</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">The order record answers a question the payment</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">ledger never could: what this person actually</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">bought, and what they asked for with it.</text>
    </g>
    <g transform="translate(480, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">OrderStatusBadge</text>
      <a href="#us-002" transform="translate(190, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-002</text></a>
      <a href="#fr-009" transform="translate(252, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-009</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Reaches PAID only on a verified provider event.</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Landing on this page proves the buyer came back,</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">not that money moved. Closing the tab is fine.</text>
    </g>
    <g transform="translate(940, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">BookingCta is a plain link</text>
      <a href="#us-004" transform="translate(250, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-004</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">An embed here would gate on functional privacy</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">settings and raise a second card seconds after</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">payment. An anchor loads no script, so none fires.</text>
    </g>
    <g transform="translate(1400, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Not configured state</text>
      <a href="#fr-027" transform="translate(210, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-027</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">With no scheduler configured this button shows</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">a not-configured state. It must check the URL</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">itself — the embed's warning sits behind a gate.</text>
    </g>
    <g transform="translate(20, 130)">
      <text x="0" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b5563" letter-spacing="1">WHAT SHIPS</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Extends the existing src/app/payment-result/page.tsx to resolve an order, not just an intent.</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="14" fill="#374151">The booking anchor carries name, email and the order id as utm_content, so the event maps back.</text>
      <text x="0" y="84" font-family="system-ui, sans-serif" font-size="14" fill="#374151">That identifier locates the record and is not retained as marketing data — see the spec's decisions.</text>
    </g>
  </g>
  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">050:03 | Order Confirmation (/payment-result) | ScriptHammer</text>
</svg>
