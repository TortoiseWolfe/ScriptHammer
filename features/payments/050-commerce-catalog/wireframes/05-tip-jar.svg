<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7ddf5"/>
      <stop offset="100%" stop-color="#b8d4f0"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <text x="960" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#4b5563" letter-spacing="1">TIP JAR - /tip</text>
  <text x="40" y="52" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">DESKTOP (16:9)</text>
  <text x="1500" y="52" fill="#d946ef" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">MOBILE</text>

  <g id="desktop" transform="translate(40, 60)">
    <rect width="1280" height="720" rx="8" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-desktop.svg#desktop-header" x="0" y="0"/>

    <text x="640" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" fill="#1f2937">Tip jar</text>
    <text x="640" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#374151">The template is free and stays free. This is only if you want to.</text>

    <!-- The cup -->
    <rect x="150" y="176" width="300" height="290" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <path d="M 250 250 L 268 380 L 332 380 L 350 250 Z" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
    <rect x="244" y="238" width="112" height="16" rx="4" fill="#dcc8a8" stroke="#b8a080"/>
    <circle cx="288" cy="320" r="10" fill="#f59e0b"/>
    <circle cx="312" cy="336" r="10" fill="#f59e0b"/>
    <rect x="222" y="396" width="156" height="46" rx="4" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="300" y="416" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">WILL WORK</text>
    <text x="300" y="434" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">FOR BITCOIN</text>

    <!-- Amount picker -->
    <rect x="490" y="176" width="640" height="290" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="514" y="206" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Pick an amount</text>
    <rect x="514" y="222" width="180" height="52" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="604" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">$5</text>
    <rect x="710" y="222" width="180" height="52" rx="6" fill="#8b5cf6"/>
    <text x="800" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8d4b8">$15</text>
    <rect x="906" y="222" width="180" height="52" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="996" y="254" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">$50</text>

    <text x="514" y="308" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Or your own</text>
    <rect x="514" y="318" width="300" height="46" rx="4" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="530" y="346" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">$ 25.00</text>
    <text x="834" y="346" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">$1 to $500. Whole dollars.</text>

    <rect x="514" y="386" width="572" height="56" rx="6" fill="#8b5cf6"/>
    <text x="800" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8d4b8">Tip $15 by card</text>

    <!-- Fee-free methods -->
    <rect x="150" y="490" width="980" height="112" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <text x="174" y="518" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Or skip the processor fee</text>
    <rect x="174" y="530" width="240" height="46" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="294" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Cash App</text>
    <rect x="430" y="530" width="240" height="46" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="550" y="558" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Chime</text>
    <text x="694" y="548" font-family="system-ui, sans-serif" font-size="14" fill="#374151">These hand off and never call back, so there is</text>
    <text x="694" y="568" font-family="system-ui, sans-serif" font-size="14" fill="#374151">no receipt and no order record. Said before you go.</text>

    <use href="includes/footer-desktop.svg#site-footer" x="0" y="640"/>

    <g class="callout"><circle cx="120" cy="320" r="14" fill="#dc2626"/><text x="120" y="325" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text></g>
    <g class="callout"><circle cx="1160" cy="248" r="14" fill="#dc2626"/><text x="1160" y="253" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text></g>
    <g class="callout"><circle cx="1160" cy="341" r="14" fill="#dc2626"/><text x="1160" y="346" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text></g>
    <g class="callout"><circle cx="1160" cy="553" r="14" fill="#dc2626"/><text x="1160" y="558" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text></g>
  </g>

  <g id="mobile" transform="translate(1360, 60)">
    <rect width="360" height="720" rx="24" fill="#e8d4b8" stroke="#b8a080"/>
    <use href="includes/header-mobile.svg#mobile-header-group" x="0" y="0"/>

    <text x="180" y="106" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" fill="#1f2937">Tip jar</text>

    <rect x="16" y="128" width="328" height="188" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <path d="M 152 176 L 166 268 L 214 268 L 228 176 Z" fill="#f5f0e6" stroke="#b8a080" stroke-width="2"/>
    <rect x="146" y="166" width="88" height="14" rx="4" fill="#dcc8a8" stroke="#b8a080"/>
    <circle cx="180" cy="228" r="9" fill="#f59e0b"/>
    <rect x="118" y="278" width="144" height="26" rx="4" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="190" y="296" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">WILL WORK FOR BTC</text>

    <rect x="16" y="330" width="328" height="180" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="36" y="346" width="86" height="46" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="79" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">$5</text>
    <rect x="136" y="346" width="86" height="46" rx="6" fill="#8b5cf6"/>
    <text x="179" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8d4b8">$15</text>
    <rect x="236" y="346" width="86" height="46" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="279" y="374" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">$50</text>
    <rect x="36" y="404" width="286" height="44" rx="4" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="52" y="432" font-family="system-ui, sans-serif" font-size="14" fill="#4b5563">$ your own — $1 to $500</text>
    <rect x="36" y="458" width="286" height="44" rx="6" fill="#8b5cf6"/>
    <text x="179" y="486" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e8d4b8">Tip $15 by card</text>

    <rect x="16" y="524" width="328" height="96" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <rect x="36" y="538" width="134" height="40" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="103" y="563" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Cash App</text>
    <rect x="186" y="538" width="134" height="40" rx="6" fill="#f5f0e6" stroke="#b8a080"/>
    <text x="253" y="563" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#1f2937">Chime</text>
    <text x="36" y="602" font-family="system-ui, sans-serif" font-size="14" fill="#374151">No receipt for these two.</text>

    <use href="includes/footer-mobile.svg#mobile-bottom-nav" x="0" y="664"/>

    <g class="callout"><circle cx="332" cy="228" r="11" fill="#dc2626"/><text x="332" y="233" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text></g>
    <g class="callout"><circle cx="332" cy="426" r="11" fill="#dc2626"/><text x="332" y="431" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text></g>
  </g>

  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <g transform="translate(20, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">The cup shakes, carefully</text>
      <a href="#us-007" transform="translate(240, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-007</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">First transform animation in the product —</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">every other one is opacity-only, on purpose.</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Suppressed by BOTH reduced-motion triggers.</text>
    </g>
    <g transform="translate(480, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">A catalog row, not a bypass</text>
      <a href="#us-001" transform="translate(250, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Pay-what-you-want is a variable-amount SKU, so</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">it resolves through the same server path as a</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">$3,500 build. That is what lets the client write go.</text>
    </g>
    <g transform="translate(940, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">The first real amount input</text>
      <a href="#us-007" transform="translate(250, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-007</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Nothing else in the product takes a typed amount,</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">which is why the existing validator never checked</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">for whole numbers, NaN or infinity. Now it must.</text>
    </g>
    <g transform="translate(1400, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Fee-free, receipt-free</text>
      <a href="#us-002" transform="translate(210, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-002</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Cash App and Chime hand off with no callback,</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">so those tips never reach the order queue. The</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">tipper is told that before leaving, not after.</text>
    </g>
    <g transform="translate(20, 130)">
      <text x="0" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b5563" letter-spacing="1">WHAT SHIPS</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">New route src/app/tip/page.tsx. Supersedes the /donate route that was specced years ago and never built.</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Becomes the first consumer of getCashAppLink and getChimeLink, whose flags have been computed and</text>
      <text x="0" y="84" font-family="system-ui, sans-serif" font-size="14" fill="#374151">never read for the life of the repo. "Will work for bitcoin" is copy on a sign, not a payment rail.</text>
    </g>
  </g>
  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">050:05 | Tip Jar (/tip) | ScriptHammer</text>
</svg>
