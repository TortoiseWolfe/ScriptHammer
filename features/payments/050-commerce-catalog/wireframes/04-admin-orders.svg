  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <g transform="translate(20, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">One screen, whole job</text>
      <a href="#us-002" transform="translate(230, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-002</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Buyer, package, amount, stage and what they</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">asked for, without opening a payment ledger</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">and inferring the rest.</text>
    </g>
    <g transform="translate(480, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Only two things write stage</text>
      <a href="#us-002" transform="translate(250, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-002</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">This panel and a verified provider event. A</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">buyer can read their own stage and never</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">write it — the refusal is a 4xx, not a 5xx.</text>
    </g>
    <g transform="translate(940, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Intake and booking</text>
      <a href="#us-003" transform="translate(190, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-003</text></a>
      <a href="#us-004" transform="translate(252, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-004</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">The screenshots that used to arrive in a chat</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">thread, sorted by the person who sent them.</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">The kickoff advanced itself, from the webhook.</text>
    </g>
    <g transform="translate(1400, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Private attachments</text>
      <a href="#fr-016" transform="translate(200, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-016</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Short-lived signed URLs. No public read on the</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">bucket, and a guessed path gets nothing —</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">ownership is checked server side, not echoed.</text>
    </g>
    <g transform="translate(20, 130)">
      <text x="0" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b5563" letter-spacing="1">WHAT SHIPS</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">New route src/app/admin/orders/page.tsx behind the existing admin gate.</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Adding this section retargets tests/e2e/admin/admin-dashboard.spec.ts, whose tab list is a hardcoded</text>
      <text x="0" y="84" font-family="system-ui, sans-serif" font-size="14" fill="#374151">five-entry array behind a test named "all admin tabs" — extend it in the SAME change, or it lies.</text>
    </g>
  </g>
  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">050:04 | Fulfillment Queue (/admin/orders) | ScriptHammer</text>
