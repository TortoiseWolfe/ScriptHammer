  <g id="annotations" transform="translate(40, 800)">
    <rect width="1840" height="220" rx="8" fill="#dcc8a8" stroke="#b8a080"/>
    <g transform="translate(20, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">1</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">A route, not an overlay</text>
      <a href="#us-001" transform="translate(240, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-001</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">/checkout?sku= is a real URL, so a quote can be</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">emailed straight to it and the back button works.</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">It also survives the provider redirect and return.</text>
    </g>
    <g transform="translate(480, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">2</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">IntakeForm</text>
      <a href="#us-003" transform="translate(140, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-003</text></a>
      <a href="#fr-013" transform="translate(202, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-013</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Business, domain, reference and notes. No</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">account step anywhere in the flow — a guest</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">session is created silently.</text>
    </g>
    <g transform="translate(940, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">3</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">IntakeUploader</text>
      <a href="#us-003" transform="translate(160, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-003</text></a>
      <a href="#fr-015" transform="translate(222, 5)"><rect width="56" height="22" rx="11" fill="#2563eb"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">FR-015</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Up to 8 files, each tagged HAVE or WANT —</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">the distinction the lead arrived without. Size</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">and type limits live at the bucket, not here.</text>
    </g>
    <g transform="translate(1400, 16)">
      <circle cx="14" cy="14" r="12" fill="#dc2626"/>
      <text x="14" y="19" text-anchor="middle" fill="#fff" font-size="14" font-weight="bold">4</text>
      <text x="38" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#1f2937">Care Plan attach</text>
      <a href="#us-005" transform="translate(170, 5)"><rect width="56" height="22" rx="11" fill="#0891b2"/><text x="28" y="17" text-anchor="middle" fill="#f5f0e6" font-size="14" font-weight="700">US-005</text></a>
      <text x="38" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Offered on any build. Billed as a second</text>
      <text x="38" y="62" font-family="system-ui, sans-serif" font-size="14" fill="#374151">order, since one item per order is the rule.</text>
      <text x="38" y="80" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Cancel terms stated before payment.</text>
    </g>
    <g transform="translate(20, 130)">
      <text x="0" y="19" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#4b5563" letter-spacing="1">WHAT SHIPS</text>
      <text x="0" y="44" font-family="system-ui, sans-serif" font-size="14" fill="#374151">New route src/app/checkout/page.tsx. The Pay action calls create-order, which resolves the price</text>
      <text x="0" y="64" font-family="system-ui, sans-serif" font-size="14" fill="#374151">from the catalog and DISCARDS any amount in the request — rejecting it would leak the real price.</text>
      <text x="0" y="84" font-family="system-ui, sans-serif" font-size="14" fill="#374151">Idempotent via edge_idempotency_keys, so a double submit yields exactly one order and one charge.</text>
    </g>
  </g>
  <text x="40" y="1060" fill="#374151" font-family="system-ui, sans-serif" font-size="18" font-weight="bold">050:02 | Checkout (/checkout) | ScriptHammer</text>
