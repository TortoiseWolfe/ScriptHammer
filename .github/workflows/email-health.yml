# Email-health gate (#361).
#
# #361: for six weeks the E2E suite signed up a non-existent Gmail address
# against the cloud project on every push. Supabase sent a real confirmation
# through Resend each time, it hard-bounced, and Resend suppressed it. By the
# time anyone looked, 121 of 154 sends had bounced — a 78.6% bounce rate — while
# every test stayed green, because nothing in CI knew what a bounce was.
#
# ESPs warn above 2-5% and suspend accounts over sustained rates. A suspended
# sender means no sign-up confirmations at all, so this is a product outage
# waiting to happen, not a metrics nicety.
#
# Same shape as the auth-config drift gate (#350): ask the live provider what is
# actually true, compare it against what we require, fail when they diverge.
#
# MODE: `block` since 2026-08-18 (#572). It started at `annotate` because the
# pre-fix bounce backlog was still inside the 7-day window and would have redded
# every run; that window rolled past on 2026-08-02 and the flip was simply never
# made, so for sixteen days the gate reported a bounce problem without failing on
# one — the annotate-forever ending that #300 is still living.
#
# Measured before flipping: the last 20 runs are 19 green / 1 red, and today's
# reports 0 bounces, so `block` does not hand anyone a permanently red workflow —
# which is the state that teaches people to stop reading a suite.
#
# `workflow_dispatch` can still pass `annotate` for a one-off investigation.
#
# Read-only: it only ever GETs /emails. It never deletes suppressions or sends.

name: Email Health

on:
  schedule:
    # Daily. This is the point of the gate — it catches damage that accumulates
    # with no repo change at all, which is exactly how #361 went unnoticed.
    - cron: '40 15 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/check-email-health.mjs'
      - '.github/workflows/email-health.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/check-email-health.mjs'
      - '.github/workflows/email-health.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'annotate (report only) or block (fail over threshold)'
        required: false
        default: 'block'
      window_days:
        description: 'Days of send history to measure'
        required: false
        default: '7'

concurrency:
  group: email-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounce-rate:
    name: Sending reputation is healthy
    # Secrets aren't passed to fork PRs — skip there instead of failing on a
    # missing key (same-repo PRs, push, schedule, dispatch all still run).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # pnpm/action-setup MUST come before setup-node. package.json declares
      # `"packageManager": "pnpm@10.16.1"`, which setup-node auto-detects and
      # then fails on with "Unable to locate executable file: pnpm" if the binary
      # isn't already on PATH. This job never runs pnpm — the script uses only
      # built-in fetch — but the detection happens regardless.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x

      - name: Check bounce rate against Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Both dispatch inputs go through env, never interpolated into the
          # run: body. workflow_dispatch inputs are only settable by someone with
          # write access, but a ${{ }} expansion inside a shell line is a script
          # injection surface regardless of who can reach it, and env costs
          # nothing. See the GitHub workflow-injection guidance.
          EMAIL_HEALTH_MODE: ${{ github.event.inputs.mode || 'block' }}
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '7' }}
        run: |
          # No pnpm install: the script uses only built-in fetch, so there is
          # nothing to resolve and the job stays under a minute.
          node scripts/check-email-health.mjs --window-days "$WINDOW_DAYS"
