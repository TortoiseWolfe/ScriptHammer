name: Component Structure Validation

# NO TRIGGER `paths:` FILTER, DELIBERATELY (#870, pattern from #869).
#
# A `paths:` filter means this reports NOTHING on an unrelated PR — and a required check
# that never reports is PENDING FOREVER, not skipped. That is exactly why CLAUDE.md lists
# `Validate Component Structure` among the checks that cannot be required as written, and
# why a broken component structure could reach main behind three green checks.
#
# Nor is there any filtering inside the workflow: `validate` runs on every pull request, and
# the always-reporting `result` job at the bottom is the context to require. Pinned by
# scripts/__tests__/component-structure-requirable.test.js.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel a PR run that a newer push has already superseded (#1119).
#
# WHY. This workflow had no `concurrency:` block at all, so a force-push left every job of
# the previous run alive to completion. Nothing consumed the result: branch protection
# evaluates a required context against the HEAD sha, so the superseded run's verdict is
# discarded whether it finishes or not. ScriptHammer spent 458 runner-hours in the first
# nine days of September — 62% of the account — and queue waits on E2E reached 30 minutes,
# which is time every other repo on the account also waits.
#
# WHY PUSH IS KEYED ON THE SHA AND NOT THE BRANCH. Grouping pushes by ref would let a merge
# cancel the run of the commit before it, and the post-merge run is the one that carries
# cross-browser coverage — CLAUDE.md's "always check the post-merge run". Keying on
# `github.sha` gives every commit on main its own group, so no post-merge run is ever
# cancelled; only PR runs are, and only by a newer push to the same PR.
#
# THIS IS NOT THE REPO-WIDE MUTEX e2e.yml USES. That one serializes runs against one shared
# Supabase project (`cancel-in-progress: false`) and deliberately does not cap anything. This
# groups per PR, so independent PRs never queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # RUNS ON EVERY PULL REQUEST. There is no path decision any more.
  #
  # This job used to sit behind a `changes` job that skipped it when a PR touched nothing
  # near the components, so most PRs showed `Validate Component Structure` as SKIPPED. A
  # skipped job is a check that did not run: the green next to it said nothing about the
  # change. The suite costs about half a minute, so the saving never paid for the
  # ambiguity. Pinned by scripts/__tests__/component-structure-requirable.test.js.
  validate:
    name: Validate Component Structure
    runs-on: ubuntu-latest
    # Cap: observed max 0.5 min. Uncapped, a hung job runs to the 360-minute default (#1119).
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile

      - name: Run component structure validation
        run: pnpm run validate:structure

      - name: Generate audit report
        if: failure()
        run: |
          node scripts/audit-components.js --path src/components --format json > component-audit.json
          node scripts/audit-components.js --path src/components --format markdown > component-audit.md

      - name: Upload audit report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: component-audit-report
          path: |
            component-audit.json
            component-audit.md

      - name: Comment PR with audit results
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('component-audit.md', 'utf8');

            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `## ❌ Component Structure Validation Failed\n\n${report}\n\n### How to fix\n\nRun the following command locally:\n\`\`\`bash\npnpm run migrate:components\n\`\`\``
            });

      - name: Check compliance rate
        if: always()
        run: |
          # Run audit script directly to get clean JSON output
          REPORT=$(node scripts/audit-components.js --path src/components --format json)
          COMPLIANCE_RATE=$(echo "$REPORT" | jq '.summary.complianceRate')

          if [ "$COMPLIANCE_RATE" -lt 100 ]; then
            echo "⚠️ Component compliance rate is ${COMPLIANCE_RATE}%"
            echo "Run 'pnpm run migrate:components' to fix non-compliant components"
          else
            echo "✅ All components are compliant!"
          fi

  # The always-reporting aggregate. THIS is the context to require, not `validate` —
  # this one reports even when the suite was cancelled or never started.
  result:
    name: Component Structure result
    runs-on: ubuntu-latest
    # Cap: aggregate only; observed max 0.1 min. Uncapped, a hung job runs to the 360-minute default (#1119).
    timeout-minutes: 5
    needs: [validate]
    if: always()
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          RESULT="${{ needs.validate.result }}"
          echo "  validate.result=$RESULT"

          # Only `success` is a pass. `skipped` and `cancelled` both mean the suite
          # observed nothing, and calling that green is the #396 shape this whole issue
          # is about.
          case "$RESULT" in
            success) echo "  component structure validated"; exit 0 ;;
            *) echo "  validation did not pass (result=$RESULT)"; exit 1 ;;
          esac
