  # STEP 5b: Firefox E2E (runs concurrently with chromium + webkit — Lever 1)
  # ============================================
  e2e-firefox:
    name: E2E (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    # Lever 1: depends only on the build/auth artifacts (same as e2e/chromium),
