  # ============================================
  # STEP 6: Merge reports and generate summary
  # ============================================
  report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [e2e, e2e-firefox, e2e-webkit]
    # Run only if at least one shard actually RAN — success or failure (#663).
    #
    # This was `always()`, which also fires when every shard was SKIPPED. That is
    # the normal state whenever the cloud-quota breaker (#567) trips: it skips all
    # 16 shards, no blob reports are uploaded, and this job then dies on
    #   Error: Directory does not exist: .../all-blob-reports
    # Observed on run 31343482645 and on every quota-blocked PR since. The result
    # is a permanently red `Test Report` that means nothing — and a check that
    # always means nothing is how people learn to skim past red checks.
    #
    # `Download blob reports` cannot be the guard: actions/download-artifact only
    # WARNS on zero matches and never creates the directory, so the failure lands
    # two steps later in `Merge reports`. The guard has to be here, at the job.
    #
    # Failure must still be covered — a failing shard is exactly when the merged
    # report matters most — so this is not `success()`. `!cancelled()` is required
    # to stop GitHub wrapping the expression in an implicit `success()`, and the
    # `>-` folded form avoids the YAML tag-indicator error that a bare leading `!`
    # would raise.
    #
    # All three shard jobs are listed even though firefox/webkit currently cannot
    # run without chromium: that coupling is a property of their `if:` conditions,
    # not of this job, and it should not silently become load-bearing here.
    if: >-
      !cancelled() &&
      (needs.e2e.result == 'success' || needs.e2e.result == 'failure' ||
      needs.e2e-firefox.result == 'success' ||
      needs.e2e-firefox.result == 'failure' ||
      needs.e2e-webkit.result == 'success' ||
      needs.e2e-webkit.result == 'failure')

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: pnpm exec playwright merge-reports --reporter=html,github ./all-blob-reports

      - name: Flaky-count honesty gate (#300)
        if: always()
        env:
          # annotate-first: surface flakes loudly (one job-summary table + one
          # annotation per flake) WITHOUT redding main while #300's four known
          # flakes are still open. `retries: 2` reports a flake as a PASS, which
          # is how four rode into main behind green ticks; this makes them
          # unmissable. Flip to "block" once #300 is clear so no NEW flake can
          # ride in behind a green tick again.
          FLAKY_GATE_MODE: annotate
        run: |
          # Own json merge (separate from the html/github merge above) → stdout →
          # file. The json reporter with no outputFile writes clean JSON to
          # stdout; the redirect captures it. Robust — no dependency on
          # PLAYWRIGHT_JSON_OUTPUT_NAME. merge-reports reads the blobs read-only,
          # so a second pass is safe.
          pnpm exec playwright merge-reports --reporter=json ./all-blob-reports > flaky-report.json
          node scripts/check-flaky-count.mjs flaky-report.json

      - name: Upload HTML report
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Generate summary
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
          HAS_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-e2e') }}
        run: |
          echo "## E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HAS_FULL_LABEL" != "true" ]; then
            echo "**PR Mode**: Chromium only (8 jobs). Add the \`full-e2e\` label to also run Firefox + WebKit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Full Mode**: Chromium + Firefox + WebKit (24 jobs total)" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the **playwright-report** artifact for detailed results." >> "$GITHUB_STEP_SUMMARY"
