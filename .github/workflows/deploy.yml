name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify PageSpeed API Key
        run: |
          if [ -z "${{ secrets.NEXT_PUBLIC_PAGESPEED_API_KEY }}" ]; then
            echo "::error::NEXT_PUBLIC_PAGESPEED_API_KEY secret is empty or not set"
            exit 1
          fi
          echo "::notice::PageSpeed API key is set (length: ${#NEXT_PUBLIC_PAGESPEED_API_KEY})"
        env:
          NEXT_PUBLIC_PAGESPEED_API_KEY: ${{ secrets.NEXT_PUBLIC_PAGESPEED_API_KEY }}

      - name: Build Next.js app
        run: pnpm run build
        env:
          NEXT_PUBLIC_AUTHOR_AVATAR: ${{ vars.NEXT_PUBLIC_AUTHOR_AVATAR }}
          NEXT_PUBLIC_AUTHOR_BIO: ${{ vars.NEXT_PUBLIC_AUTHOR_BIO }}
          NEXT_PUBLIC_AUTHOR_BLUESKY: ${{ vars.NEXT_PUBLIC_AUTHOR_BLUESKY }}
          NEXT_PUBLIC_AUTHOR_EMAIL: ${{ vars.NEXT_PUBLIC_AUTHOR_EMAIL }}
          NEXT_PUBLIC_AUTHOR_GITHUB: ${{ vars.NEXT_PUBLIC_AUTHOR_GITHUB }}
          NEXT_PUBLIC_AUTHOR_LINKEDIN: ${{ vars.NEXT_PUBLIC_AUTHOR_LINKEDIN }}
          NEXT_PUBLIC_AUTHOR_MASTODON: ${{ vars.NEXT_PUBLIC_AUTHOR_MASTODON }}
          NEXT_PUBLIC_AUTHOR_NAME: ${{ vars.NEXT_PUBLIC_AUTHOR_NAME }}
          NEXT_PUBLIC_AUTHOR_ROLE: ${{ vars.NEXT_PUBLIC_AUTHOR_ROLE }}
          NEXT_PUBLIC_AUTHOR_TWITCH: ${{ vars.NEXT_PUBLIC_AUTHOR_TWITCH }}
          NEXT_PUBLIC_AUTHOR_TWITTER: ${{ vars.NEXT_PUBLIC_AUTHOR_TWITTER }}
          NEXT_PUBLIC_AUTHOR_WEBSITE: ${{ vars.NEXT_PUBLIC_AUTHOR_WEBSITE }}
          # NEXT_PUBLIC_BASE_PATH intentionally omitted - auto-detected from GITHUB_REPOSITORY
          NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_CALENDAR_PROVIDER: ${{ vars.NEXT_PUBLIC_CALENDAR_PROVIDER }}
          NEXT_PUBLIC_CALENDAR_URL: ${{ vars.NEXT_PUBLIC_CALENDAR_URL }}
          # (#353) Turnstile bot protection. PUBLIC — it ships in the page
          # HTML, so it is a var not a secret. Absent/empty leaves sign-up
          # CAPTCHA inert, which is the fork-safe default.
          NEXT_PUBLIC_CAPTCHA_SITE_KEY: ${{ vars.NEXT_PUBLIC_CAPTCHA_SITE_KEY }}
          NEXT_PUBLIC_DISQUS_SHORTNAME: ${{ vars.NEXT_PUBLIC_DISQUS_SHORTNAME }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ vars.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_PAGESPEED_API_KEY: ${{ secrets.NEXT_PUBLIC_PAGESPEED_API_KEY }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
          NEXT_PUBLIC_PAYPAL_PLAN_ID: ${{ secrets.NEXT_PUBLIC_PAYPAL_PLAN_ID }}
          NEXT_PUBLIC_PROJECT_NAME: ${{ vars.NEXT_PUBLIC_PROJECT_NAME }}
          NEXT_PUBLIC_PROJECT_OWNER: ${{ vars.NEXT_PUBLIC_PROJECT_OWNER }}
          NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SOCIAL_PLATFORMS: ${{ vars.NEXT_PUBLIC_SOCIAL_PLATFORMS }}
          NEXT_PUBLIC_STRIPE_PRICE_ID: ${{ secrets.NEXT_PUBLIC_STRIPE_PRICE_ID }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ${{ secrets.NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY }}
          NEXT_PUBLIC_DEPLOY_URL: ${{ vars.NEXT_PUBLIC_DEPLOY_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Last line of defense before shipping (#294): `pnpm build` above can emit a
      # chunk the browser cannot PARSE (an inlined WASM template literal with
      # octal escapes) while itself succeeding. That would deploy a site whose
      # client JS is dead on every route, as it did for hours. Fail the deploy
      # instead.
      - name: Verify chunks parse in a browser (#294)
        run: node scripts/check-chunks-parse.mjs

      # First-load budget (#291): three.js must stay OFF non-3D routes' initial
      # payload. Nothing else measures first-load JS, so a lost cacheGroup entry
      # or a new static `three` import would silently re-bloat every route.
      - name: Verify three.js is off non-3D routes (#291)
        run: node scripts/check-first-load-budget.mjs

      - name: Build Storybook
        run: pnpm run build-storybook

      - name: Add cache busting and merge outputs
        run: |
          # Create merged output directory
          mkdir -p merged-output

          # Check if Next.js build output exists and copy it
          if [ -d "out" ]; then
            echo "Copying Next.js build from 'out' directory..."
            cp -r out/* merged-output/
          else
            echo "Warning: 'out' directory not found. The Next.js build may have failed."
            # Create a minimal index.html to prevent complete failure
            echo "<html><body><h1>Build Error</h1><p>The Next.js build did not complete successfully.</p></body></html>" > merged-output/index.html
          fi

          # Check if Storybook build exists and copy it
          if [ -d "storybook-static" ]; then
            echo "Copying Storybook build..."
            cp -r storybook-static merged-output/storybook
            # Add build timestamp to force cache refresh
            echo "Build: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > merged-output/storybook/BUILD_TIME.txt
          else
            echo "Warning: 'storybook-static' directory not found. Storybook build may have failed."
          fi

          # Create _headers file for cache control (GitHub Pages doesn't use it but good practice)
          cat > merged-output/_headers << EOF
          /storybook/*
            Cache-Control: no-cache, no-store, must-revalidate
            Pragma: no-cache
            Expires: 0

          /storybook/static/*
            Cache-Control: public, max-age=31536000, immutable
          EOF

      # KEEP THE PREVIOUS BUILD'S HASHED ASSETS (#476).
      #
      # Runs AFTER the merge, so it can see what this build produced and add only
      # what is missing. It never overwrites a new file.
      #
      # GitHub Pages replaces the whole site per deploy, so the previous build's
      # content-hashed CSS and JS are DELETED the moment this publishes. Pages
      # serves HTML with `cache-control: max-age=600`, so for ten minutes after
      # every deploy a visitor can be holding the previous build's HTML while its
      # stylesheets no longer exist. They get the site with NO CSS: white page,
      # no nav, images at natural size. Reported from production three times.
      #
      # The service worker is NOT in that path — `sw.js` bypasses `/_next/` — which
      # is why two worker fixes (#438, #467) did not stop it. The first occurrence
      # even self-healed before its "fix" merged, because a ten-minute cache
      # window always looks fixed afterwards.
      #
      # Reproduced, and this fix verified, by `scripts/check-stale-html.mjs`:
      # stale HTML with a cold asset cache gives 0 CSS rules and a 3099px header;
      # with the previous assets retained it gives 498 rules and a 65px header.
      #
      # `|| true`: shipping a new build is strictly better than not shipping, so a
      # network problem here must not block the deploy. The script prints a
      # ::warning:: on a zero count rather than passing silently.
      #
      # `continue-on-error` rather than `|| true`: a network problem must not
      # block shipping, but it must be VISIBLE. `|| true` prints a warning inside
      # a green check, which is how the first version of this step would have
      # gone unnoticed — it collected 0 assets because the host could not resolve
      # the domain, and exited 0 anyway.
      # Retention, and the manifest the NEXT deploy retains from, are ONE step:
      # the manifest has to list what this build actually PUBLISHES — its own
      # files plus everything it kept — and that is only knowable after the copy.
      #
      # A SEPARATE MANIFEST STEP RUNNING FIRST IS WHAT CAUSED #548. It listed
      # only this build's own files, so every deploy forgot its grandparent and
      # retention spanned exactly ONE generation. That is enough only if at most
      # one deploy lands per HTML cache window — Pages sends `max-age=600`, so a
      # visitor can hold this build's HTML for TEN MINUTES. Six PRs merged in 35
      # minutes (two of them 57 seconds apart) put real visitors two generations
      # behind, and their stylesheets had been deleted: white page, no nav, logo
      # at natural size. Chained, a burst is survivable.
      #
      # Reproduced both ways by `scripts/check-stale-html.mjs`, which now drives
      # A -> B -> C and asserts one-generation retention STILL breaks. If that
      # negative control ever stops failing, the harness has stopped modelling a
      # deploy rather than the bug being fixed.
      #
      # `continue-on-error` rather than `|| true`: a network problem must not
      # block shipping, but it must be VISIBLE. `|| true` prints a warning inside
      # a green check, which is how the first version of this step went
      # unnoticed — it collected 0 assets because the host could not resolve the
      # domain, and exited 0 anyway.
      - name: Retain previous builds' assets and write the manifest (#476, #548)
        continue-on-error: true
        run: |
          node scripts/retain-previous-assets.mjs merged-output \
            "${SITE_URL:-https://scripthammer.com}"
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          # How many generations back an asset is carried. Bounds _next/static so
          # chaining cannot grow forever.
          #
          # WAS 5, AND THE REASONING WAS WRONG. It was sized against "deploys per 10
          # minutes" — the HTML cache-control window. But the thing being protected
          # is not a 10-minute window, it is HOW LONG SOMEONE'S TAB HAS BEEN OPEN,
          # and those are unrelated quantities. On 2026-08-09 production rendered
          # unstyled for the SIXTH time (#438, #467, #476, #548): five deploys landed
          # across 22 hours — well-paced by the 10-minute rule — and a visitor
          # returning the next day asked for CSS that had just aged out. Retention
          # worked exactly as designed; the design measured the wrong thing.
          #
          # 30 covers a normal working week even at an unusually high merge rate.
          # Measured cost: 3-5 hashed files per generation (17 files bought the old
          # 5), so ~100 small files against a 131-page export.
          #
          # This is a MITIGATION. The recovery that does not depend on any number is
          # the self-heal in src/app/layout.tsx; the actual fix is #635 — a CDN
          # serving HTML `no-cache`, which GitHub Pages cannot be configured to do.
          RETAIN_GENERATIONS: '30'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./merged-output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
