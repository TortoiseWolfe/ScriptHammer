name: Accessibility Testing

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel a PR run that a newer push has already superseded (#1119).
#
# WHY. This workflow had no `concurrency:` block at all, so a force-push left every job of
# the previous run alive to completion. Nothing consumed the result: branch protection
# evaluates a required context against the HEAD sha, so the superseded run's verdict is
# discarded whether it finishes or not. ScriptHammer spent 458 runner-hours in the first
# nine days of September — 62% of the account — and queue waits on E2E reached 30 minutes,
# which is time every other repo on the account also waits.
#
# WHY PUSH IS KEYED ON THE SHA AND NOT THE BRANCH. Grouping pushes by ref would let a merge
# cancel the run of the commit before it, and the post-merge run is the one that carries
# cross-browser coverage — CLAUDE.md's "always check the post-merge run". Keying on
# `github.sha` gives every commit on main its own group, so no post-merge run is ever
# cancelled; only PR runs are, and only by a newer push to the same PR.
#
# THIS IS NOT THE REPO-WIDE MUTEX e2e.yml USES. That one serializes runs against one shared
# Supabase project (`cancel-in-progress: false`) and deliberately does not cap anything. This
# groups per PR, so independent PRs never queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  accessibility:
    runs-on: ubuntu-latest
    # Cap: observed max 3.8 min; generous because this is a REQUIRED check and a Playwright/browser download can spike it (#801). Uncapped, a hung job runs to the 360-minute default (#1119).
    timeout-minutes: 20

    # Only the public NEXT_PUBLIC_* pair — this job builds the static export and
    # runs pa11y plus three component a11y specs, none of which reach a backend.
    # See the note in ci.yml; same reasoning, same ticket. #574
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      # A RETURNING VISITOR MUST GET STYLED HTML ACROSS A DEPLOY (#476).
      #
      # Production has rendered with no CSS three times, and no gate ever caught
      # it, because every check in this repo opens a FRESH browser context — an
      # empty HTTP cache always fetches HTML and assets from the same build, and
      # this bug only exists when they come from different ones.
      #
      # Lives here rather than in the Playwright suites because it needs a real
      # production build in ./out, which this job already produces, and because
      # `accessibility` is a required check — a guard nothing runs is how
      # `validate:breakpoints` sat broken and unnoticed (#373 §B2).
      - name: Verify a returning visitor is styled across a deploy (#476)
        run: node scripts/check-stale-html.mjs

      - name: Run accessibility tests
        run: pnpm run test:a11y:ci

      # NOTE: the component accessibility specs are deliberately NOT re-run here.
      # This step used to run Button/Card/Text.accessibility — an arbitrary 3 of
      # the 10+ *.accessibility.test.tsx files in the repo — and all three are
      # already executed by ci.yml's suite (verified on 46be768: they appear in
      # its 373-file run). It cost ~3m45s of a 7-minute REQUIRED check, more
      # than half of it, and over 90% of that was vitest startup rather than
      # accessibility testing.
      #
      # What this workflow uniquely provides is Pa11y against the real built
      # output plus the #476 stale-HTML guard. Component-level a11y assertions
      # belong to the unit suite and are gated there. #573

      - name: Upload Pa11y screenshots
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: pa11y-screenshots
          path: .pa11y-screenshots/

      - name: Comment PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Accessibility tests failed. Please check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
