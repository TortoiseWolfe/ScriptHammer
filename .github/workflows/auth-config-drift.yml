# Auth-config drift gate (#288, item 4).
#
# #287: prod's Supabase auth config had silently drifted (site_url=localhost,
# empty uri_allow_list) while every test stayed green — no human could sign up.
# This runs `pnpm supabase:auth-config:check` (a read-only dry-run of the
# Management API vs the checked-in scripts/supabase/auth-config.json) and FAILS
# on any drift, so prod config can't diverge from the repo unnoticed again.
#
# Secrets already exist in the repo (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF).
# Read-only — it never PATCHes (that needs --apply, which this does not pass).
#
# Runs: on push to main (after a merge), on PRs that touch the auth config or this
# workflow (validates + gives PR-time feedback), daily (catches OUT-OF-BAND prod
# changes with no repo change), and on demand.

name: Auth Config Drift

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/supabase/auth-config.json'
      - 'scripts/supabase/set-auth-config.ts'
      - '.github/workflows/auth-config-drift.yml'
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

concurrency:
  group: auth-config-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    name: Live auth config matches the repo
    # Secrets aren't passed to fork PRs — skip there instead of failing on a
    # missing token (same-repo PRs, push, schedule, dispatch all still run).
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check prod auth config matches scripts/supabase/auth-config.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # A fork's overrides, one per FORK_OVERRIDABLE key in
          # scripts/supabase/auth-config-loader.js. GitHub does NOT expose `vars.*`
          # to a step automatically — without these eight lines a fork could set
          # every repository Variable exactly as rebrand.sh instructs and STILL be
          # measured against ScriptHammer's defaults, because the runner never saw
          # them. The override mechanism would read as configurable and behave as
          # hardcoded: a gate that cannot fail for the fork, and cannot pass either.
          #
          # Unset here resolves to '' and `interpolate` treats '' as unset, so
          # ScriptHammer's own run still gets the pinned defaults and still detects
          # real drift. Nothing is secret — see .env.example; both OAuth client ids
          # already appear in every authorize URL the browser is redirected to.
          #
          # scripts/__tests__/auth-config-loader.test.js fails if this list and
          # FORK_OVERRIDABLE disagree in either direction.
          AUTH_SITE_URL: ${{ vars.AUTH_SITE_URL }}
          AUTH_URI_ALLOW_LIST: ${{ vars.AUTH_URI_ALLOW_LIST }}
          AUTH_SMTP_HOST: ${{ vars.AUTH_SMTP_HOST }}
          AUTH_SMTP_USER: ${{ vars.AUTH_SMTP_USER }}
          AUTH_SMTP_ADMIN_EMAIL: ${{ vars.AUTH_SMTP_ADMIN_EMAIL }}
          AUTH_SMTP_SENDER_NAME: ${{ vars.AUTH_SMTP_SENDER_NAME }}
          AUTH_GITHUB_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_ID: ${{ vars.AUTH_GOOGLE_CLIENT_ID }}
        run: pnpm supabase:auth-config:check
