# Auth-config drift gate (#288, item 4).
#
# #287: prod's Supabase auth config had silently drifted (site_url=localhost,
# empty uri_allow_list) while every test stayed green — no human could sign up.
# This runs `pnpm supabase:auth-config:check` (a read-only dry-run of the
# Management API vs the checked-in scripts/supabase/auth-config.json) and FAILS
# on any drift, so prod config can't diverge from the repo unnoticed again.
#
# Secrets already exist in the repo (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF).
# Read-only — it never PATCHes (that needs --apply, which this does not pass).
#
# Runs: on push to main (after a merge), on PRs that touch the auth config or this
# workflow (validates + gives PR-time feedback), daily (catches OUT-OF-BAND prod
# changes with no repo change), and on demand.

name: Auth Config Drift

# NO TRIGGER `paths:` FILTER, DELIBERATELY (#870, pattern from #869).
#
# A `paths:` filter means this reports NOTHING on an unrelated PR — and a required check
# that never reports is PENDING FOREVER, not skipped, so it could never be required.
#
# This does NOT increase the number of live Supabase calls. The `changes` job below gates
# the drift job on exactly the paths the filter used to name, so an unrelated PR still
# makes no API call; only the trivial aggregate runs. Pinned by
# scripts/__tests__/auth-config-drift-requirable.test.js.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '15 15 * * *'
  workflow_dispatch:

concurrency:
  group: auth-config-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Does this change need a drift check?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      configured: ${{ steps.configured.outputs.configured }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # push, schedule and dispatch always run — the daily cron is the whole point
            # of this workflow, and main is the reference state.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "  ${{ github.event_name }} — running unconditionally"
            exit 0
          fi
          node scripts/ci/auth-config-drift-changes.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

      # IS THERE A PROJECT TO INTERROGATE? (#985)
      #
      # A fresh fork has no Supabase project, so this workflow asked a live API about
      # nothing and failed — teaching a new forker that red checks are normal, which is
      # the state in which the next real failure gets ignored.
      #
      # It has to be a job OUTPUT rather than a one-line `if:`, because the `secrets`
      # context is not available in a job-level `if:` at all. Only `vars` can be tested
      # there, and half of this pair is a secret.
      #
      # HALF-CONFIGURED STILL FAILS, deliberately. Skipping whenever anything is
      # missing would mean deleting the token here silently retires a daily gate — a
      # protection going quiet is the failure mode this whole file exists to catch. So:
      # neither set is "no project yet"; exactly one set is a misconfiguration and says
      # which half is missing.
      - name: Is a Supabase project configured?
        id: configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "  Supabase project configured — the drift check will run"
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Supabase project configured, so there is no live auth config to compare against. Set the SUPABASE_PROJECT_REF repository VARIABLE and the SUPABASE_ACCESS_TOKEN repository SECRET to enable this check."
            exit 0
          fi
          echo "::error::Supabase is half-configured, which is not the same as unconfigured."
          [ -n "$SUPABASE_PROJECT_REF" ] || echo "::error::  missing repository VARIABLE  SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || echo "::error::  missing repository SECRET    SUPABASE_ACCESS_TOKEN"
          exit 1

  drift:
    needs: changes
    name: Live auth config matches the repo
    # Secrets aren't passed to fork PRs — skip there instead of failing on a
    # missing token (same-repo PRs, push, schedule, dispatch all still run).
    if: ${{ needs.changes.outputs.run == 'true' && needs.changes.outputs.configured == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check prod auth config matches scripts/supabase/auth-config.json
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # A fork's overrides, one per FORK_OVERRIDABLE key in
          # scripts/supabase/auth-config-loader.js. GitHub does NOT expose `vars.*`
          # to a step automatically — without these eight lines a fork could set
          # every repository Variable exactly as rebrand.sh instructs and STILL be
          # measured against ScriptHammer's defaults, because the runner never saw
          # them. The override mechanism would read as configurable and behave as
          # hardcoded: a gate that cannot fail for the fork, and cannot pass either.
          #
          # Unset here resolves to '' and `interpolate` treats '' as unset, so
          # ScriptHammer's own run still gets the pinned defaults and still detects
          # real drift. Nothing is secret — see .env.example; both OAuth client ids
          # already appear in every authorize URL the browser is redirected to.
          #
          # scripts/__tests__/auth-config-loader.test.js fails if this list and
          # FORK_OVERRIDABLE disagree in either direction.
          AUTH_SITE_URL: ${{ vars.AUTH_SITE_URL }}
          AUTH_URI_ALLOW_LIST: ${{ vars.AUTH_URI_ALLOW_LIST }}
          AUTH_SMTP_HOST: ${{ vars.AUTH_SMTP_HOST }}
          AUTH_SMTP_USER: ${{ vars.AUTH_SMTP_USER }}
          AUTH_SMTP_ADMIN_EMAIL: ${{ vars.AUTH_SMTP_ADMIN_EMAIL }}
          AUTH_SMTP_SENDER_NAME: ${{ vars.AUTH_SMTP_SENDER_NAME }}
          AUTH_GITHUB_CLIENT_ID: ${{ vars.AUTH_GITHUB_CLIENT_ID }}
          AUTH_GOOGLE_CLIENT_ID: ${{ vars.AUTH_GOOGLE_CLIENT_ID }}
        run: pnpm supabase:auth-config:check

  # The always-reporting aggregate. THIS is the context to require, not `drift`.
  result:
    name: Auth Config Drift result
    runs-on: ubuntu-latest
    needs: [changes, drift]
    if: always()
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          RAN="${{ needs.changes.outputs.run }}"
          CONFIGURED="${{ needs.changes.outputs.configured }}"
          RESULT="${{ needs.drift.result }}"
          echo "  changes.run=$RAN  changes.configured=$CONFIGURED  drift.result=$RESULT"

          # The `changes` job itself fails on a half-configured project, and that
          # failure must not be laundered into green by the skip branches below.
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "  the preflight did not pass (result=${{ needs.changes.result }})"
            exit 1
          fi

          if [ "$RAN" != "true" ]; then
            echo "  no auth-config paths changed — drift check skipped, reporting green"
            exit 0
          fi

          if [ "$CONFIGURED" != "true" ]; then
            echo "  no Supabase project configured — nothing to compare against, reporting green"
            exit 0
          fi

          # THE FORK CASE, and the reason this aggregate differs from the others.
          # `drift` carries its own `if:` that skips on fork PRs, because secrets are
          # withheld there and the job cannot authenticate. Treating that skip as a
          # failure would make every fork PR permanently unmergeable once this context is
          # required — which is the same "cannot merge" trap the paths filter created.
          if [ "$RESULT" = "skipped" ]; then
            echo "  drift job skipped (fork PR: no secrets available) — reporting green"
            exit 0
          fi

          # A cancelled run observed nothing, and calling that green is the #396 shape.
          case "$RESULT" in
            success) echo "  live auth config matches the repo"; exit 0 ;;
            *) echo "  drift check did not pass (result=$RESULT)"; exit 1 ;;
          esac
