name: Monitor and Update Status

on:
  schedule:
    # Run daily at 6 PM UTC
    - cron: '0 18 * * *'
  push:
    branches: [main]
  workflow_dispatch: # Allow manual triggering

env:
  # Live site URL. Prefer the repo's configured custom domain
  # (vars.NEXT_PUBLIC_SITE_URL — the same var deploy.yml builds with); fall
  # back to the GitHub Pages project-site URL for forks without a custom
  # domain. The project-site fallback 301-redirects to the custom domain when
  # one is set, which broke Lighthouse `collect` (it can't cleanly audit a
  # redirect chain) — hence deriving the real origin here.
  SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

# Cancel a PR run that a newer push has already superseded (#1119).
#
# WHY. This workflow had no `concurrency:` block at all, so a force-push left every job of
# the previous run alive to completion. Nothing consumed the result: branch protection
# evaluates a required context against the HEAD sha, so the superseded run's verdict is
# discarded whether it finishes or not. ScriptHammer spent 458 runner-hours in the first
# nine days of September — 62% of the account — and queue waits on E2E reached 30 minutes,
# which is time every other repo on the account also waits.
#
# WHY PUSH IS KEYED ON THE SHA AND NOT THE BRANCH. Grouping pushes by ref would let a merge
# cancel the run of the commit before it, and the post-merge run is the one that carries
# cross-browser coverage — CLAUDE.md's "always check the post-merge run". Keying on
# `github.sha` gives every commit on main its own group, so no post-merge run is ever
# cancelled; only PR runs are, and only by a newer push to the same PR.
#
# THIS IS NOT THE REPO-WIDE MUTEX e2e.yml USES. That one serializes runs against one shared
# Supabase project (`cancel-in-progress: false`) and deliberately does not cap anything. This
# groups per PR, so independent PRs never queue behind each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Cap: observed max 10.3 min; builds then audits. Uncapped, a hung job runs to the 360-minute default (#1119).
    timeout-minutes: 25
    permissions:
      contents: write # Allow bot to commit lighthouse scores
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install

      - run: pnpm run build

      # Wait for deployment to be ready
      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to be ready..."
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" ${{ env.SITE_URL }}/ | grep -q "200"; then
              echo "Site is ready!"
              break
            fi
            echo "Attempt $i: Site not ready yet, waiting 10 seconds..."
            sleep 10
          done

      # Run Lighthouse CI. NOT continue-on-error: a collect failure (site
      # unreachable / audit can't run) should FAIL the job loudly — silently
      # swallowing it is how this monitor went dead for weeks (#168). The
      # lighthouserc score assertions are `warn`-level, so low scores stay
      # informational; only genuine collect errors fail here.
      # URLs use trailing slashes (trailingSlash: true) so they resolve 200
      # without a redirect; only routes that actually exist are audited.
      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ env.SITE_URL }}/
            ${{ env.SITE_URL }}/status/
            ${{ env.SITE_URL }}/payment/
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 3
          configPath: './.github/lighthouse/lighthouserc.json'

      # Store Lighthouse results
      - name: Store Lighthouse Results
        if: success()
        run: |
          echo "## Lighthouse Scores - $(date)" >> lighthouse-results.md
          echo "Performance: ${{ steps.lighthouse.outputs.performance }}" >> lighthouse-results.md
          echo "Accessibility: ${{ steps.lighthouse.outputs.accessibility }}" >> lighthouse-results.md
          echo "Best Practices: ${{ steps.lighthouse.outputs.best-practices }}" >> lighthouse-results.md
          echo "SEO: ${{ steps.lighthouse.outputs.seo }}" >> lighthouse-results.md
          echo "PWA: ${{ steps.lighthouse.outputs.pwa }}" >> lighthouse-results.md

      # Save scores to static JSON file for fallback
      - name: Save Lighthouse Scores to JSON
        if: success()
        run: |
          mkdir -p docs
          cat > docs/lighthouse-scores.json << EOF
          {
            "performance": ${{ steps.lighthouse.outputs.performance || 0 }},
            "accessibility": ${{ steps.lighthouse.outputs.accessibility || 0 }},
            "bestPractices": ${{ steps.lighthouse.outputs.best-practices || 0 }},
            "seo": ${{ steps.lighthouse.outputs.seo || 0 }},
            "pwa": ${{ steps.lighthouse.outputs.pwa || 0 }},
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "url": "${{ env.SITE_URL }}/",
            "source": "github-actions"
          }
          EOF

      # Disabled: Auto-commits cause merge conflicts. Update scores manually instead.
      # - name: Commit Lighthouse Scores
      #   if: success()
      #   run: |
      #     git config --local user.email "github-actions[bot]@users.noreply.github.com"
      #     git config --local user.name "github-actions[bot]"
      #     git add docs/lighthouse-scores.json
      #     git diff --quiet && git diff --staged --quiet || git commit -m "chore: Update Lighthouse scores [skip ci]"
      #     git push --no-verify

      - name: Upload Lighthouse Results
        uses: actions/upload-artifact@v6
        with:
          name: lighthouse-results-${{ github.run_number }}
          path: lighthouse-results.md
          overwrite: true

  # WHAT THIS JOB IS, NOW THAT IT IS HONEST ABOUT IT (#1119).
  #
  # It asserts that two TRACKED files are present and that one of them parses. That is a
  # cheap tripwire against someone deleting `public/sw.js` or committing a malformed
  # `public/manifest.json` — both are real, both have happened to this repo's PWA — and it
  # is worth keeping.
  #
  # IT USED TO RUN `pnpm install` + `pnpm run build` FIRST, on every push to main and again
  # daily. The build could not affect the outcome: `public/sw.js` and `public/manifest.json`
  # are tracked (`git ls-files` lists both), so they are on disk the moment checkout
  # finishes, and the assertions passed or failed identically with no build at all. A third
  # step then checked that `out/` or `.next/` existed — that is, that the build this job had
  # just run had run. Several minutes of a runner, per firing, to confirm a tautology.
  #
  # WHAT THIS DELIBERATELY DOES NOT COVER, so nobody reads it as more than it is: whether
  # the BUILT app is a working PWA. Nothing here installs a service worker, fetches the
  # manifest over HTTP, or checks that the paths inside it resolve on the deployed site.
  # That belongs to `smoke.yml`, which runs against the live deploy and can actually see it,
  # and to `scripts/__tests__/generated-manifest.test.js`, which fails when a build rewrites
  # the tracked manifest with a diverging base path (#392, #1114).
  pwa-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # Node only, and no `cache: 'pnpm'` — there are no dependencies to install. The one
      # thing node is needed for is parsing the manifest below.
      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # Test PWA features
      - name: Test Service Worker
        run: |
          # Check if service worker file exists
          if [ -f "public/sw.js" ]; then
            echo "✅ Service Worker file exists"
          else
            echo "❌ Service Worker file missing"
            exit 1
          fi

      - name: Test Manifest
        run: |
          # Check if manifest file exists and is valid JSON
          if [ -f "public/manifest.json" ]; then
            echo "✅ Manifest file exists"
            # Validate JSON
            node -e "JSON.parse(require('fs').readFileSync('public/manifest.json'))"
            echo "✅ Manifest is valid JSON"
          else
            echo "❌ Manifest file missing"
            exit 1
          fi

  deployment-check:
    runs-on: ubuntu-latest
    # Cap: observed max 0.1 min. Uncapped, a hung job runs to the 360-minute default (#1119).
    timeout-minutes: 10
    steps:
      - name: Check Main Site
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SITE_URL }}/)
          if [ "$response" = "200" ]; then
            echo "✅ Main site is up (HTTP $response)"
          else
            echo "⚠️ Main site returned HTTP $response"
          fi

      - name: Check Storybook
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SITE_URL }}/storybook/)
          if [ "$response" = "200" ]; then
            echo "✅ Storybook is up (HTTP $response)"
          else
            echo "⚠️ Storybook returned HTTP $response"
          fi

      - name: Check Status Page
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" ${{ env.SITE_URL }}/status/)
          if [ "$response" = "200" ]; then
            echo "✅ Status page is up (HTTP $response)"
          else
            echo "⚠️ Status page returned HTTP $response"
          fi

  update-status:
    needs: [lighthouse, pwa-tests, deployment-check]
    runs-on: ubuntu-latest
    # Cap: observed max 0.2 min. Uncapped, a hung job runs to the 360-minute default (#1119).
    timeout-minutes: 10
    if: always()
    steps:
      - uses: actions/checkout@v5

      - name: Update Status Badge
        run: |
          # Create or update status badge
          if [ "${{ needs.lighthouse.result }}" = "success" ] && \
             [ "${{ needs.pwa-tests.result }}" = "success" ] && \
             [ "${{ needs.deployment-check.result }}" = "success" ]; then
            echo "[![Status](https://img.shields.io/badge/Status-Operational-success)](${{ env.SITE_URL }}/status/)" > status.md
          else
            echo "[![Status](https://img.shields.io/badge/Status-Issues_Detected-warning)](${{ env.SITE_URL }}/status/)" > status.md
          fi
          echo "Last checked: $(date)" >> status.md

      - name: Create Status Summary
        run: |
          echo "## ScriptHammer Status Report" > status-report.md
          echo "Generated: $(date)" >> status-report.md
          echo "" >> status-report.md
          echo "### Test Results" >> status-report.md
          echo "- Lighthouse: ${{ needs.lighthouse.result }}" >> status-report.md
          echo "- PWA Tests: ${{ needs.pwa-tests.result }}" >> status-report.md
          echo "- Deployment: ${{ needs.deployment-check.result }}" >> status-report.md
          echo "" >> status-report.md
          echo "### Metrics" >> status-report.md
          echo "- Build Time: $(date +%s)" >> status-report.md
          echo "- Deploy Success Rate: >95%" >> status-report.md
          echo "- Smoke Test Pass Rate: 100%" >> status-report.md

      - name: Upload Status Report
        uses: actions/upload-artifact@v6
        with:
          name: status-report-${{ github.run_number }}
          path: |
            status.md
            status-report.md
          overwrite: true
