name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    # Only the public NEXT_PUBLIC_* pair. This job's Supabase calls are ALL
    # mocked (tests/setup.ts mocks @/lib/supabase/{client,server} globally) and
    # every test that would need a real backend is excluded in vitest.config.ts
    # with reasons like "requires service role key". So SUPABASE_SERVICE_ROLE_KEY
    # and TEST_USER_PRIMARY_PASSWORD were materialised in the environment of the
    # single highest-frequency workflow in the repo, and nothing could use them.
    #
    # The service-role key bypasses RLS entirely — it is the credential the whole
    # conformance suite exists to make unnecessary. Do not re-add it here without
    # a test that actually needs it. #574
    env:
      NEXT_PUBLIC_DEPLOY_URL: ${{ vars.NEXT_PUBLIC_DEPLOY_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate project configuration
        run: node scripts/detect-project.js

      - name: Run linter
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      # The script existed and already failed — CSS said `sm` was 430px while
      # src/config/breakpoints.ts said 428px — and it was wired into no workflow
      # and no hook (#373 B2). Landing it green here is what keeps the two in
      # step; without this step the mirror silently drifts again.
      - name: Validate breakpoint configuration
        run: pnpm validate:breakpoints

      - name: Run tests
        run: pnpm test --run

      # Eight node:test files under scripts/__tests__/ cover the tooling
      # scripts CI itself runs — detect-project.js (step above), validate-
      # structure.js, audit-components.js (both in component-structure.yml),
      # migrate-components.js (the command that workflow's PR-comment tells
      # you to run on failure), plop-generator.js (the mandatory component
      # generator). vitest.config.ts:20-21 excludes them because vitest
      # cannot load require('node:test'). These sat dark since the initial
      # commit with only the exclude and no corresponding runner. 86 pass,
      # 1 intentional todo (spec-for-unbuilt-feature), 1 intentional file-
      # skip (contract infra never provisioned). Exit 0.
      - name: Run script tests (node:test)
        run: pnpm test:scripts

      - name: Check test coverage
        run: pnpm test:coverage

      - name: Build application
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
