# Production security-schema drift (#903).
#
# WHY. #897 found that production had never received #565's REVOKE — `authenticated` still
# held UPDATE on payment_intents three weeks after the migration removed it — and that
# production was missing the `Admin can view all payment intents` policy while carrying the
# other nine. Both were found by hand, by chance, while scoping an unrelated ticket.
#
# Nothing would have found them otherwise. `pnpm test:rls` runs against a LOCAL stack, so it
# pins what a FRESH database gets from the migration and is structurally blind to the hosted
# project. The migration is applied to production by hand, if at all — no workflow runs it —
# so every schema change has two independent states and only one was ever checked.
#
# NOT PR-TRIGGERED, DELIBERATELY. This holds a production credential, and #575 and #897 are
# both about keeping those away from PR jobs that then run an arbitrary dependency graph.
# `intake-orphan-sweep.yml` is the existing precedent for a scheduled job that legitimately
# holds one. The comparator itself IS gated on every PR — scripts/__tests__/prod-schema-drift.test.js
# runs under the required `Test (20.x)` check and drives evaluate() in both directions,
# including the real pre-fix #897 state.
#
# REPORTS ONLY. It never issues DDL. Applying the migration to production is a separate
# decision with a much larger blast radius.
#
# Both secrets already exist in the repo (SUPABASE_ACCESS_TOKEN, and the project ref is
# public). A missing one FAILS the job rather than passing — a misconfigured drift check
# that reports success is the exact defect this is here to end.

name: Prod Schema Drift

on:
  schedule:
    # Daily. Out-of-band production changes have no repo event to hang off, so the cron
    # is the whole point — #897's drift arrived with no commit behind it.
    - cron: '40 6 * * *'
  push:
    branches: [main]
    paths:
      # A paths filter is safe HERE, unlike on a required check: nothing requires this
      # workflow, so a run that never reports is simply a run that did not happen. The
      # daily cron covers everything this filter skips.
      - 'supabase/migrations/**'
      - 'scripts/ci/check-prod-schema-drift.mjs'
      # The intent is PARSED from the migration now (#1038), so the parser is as
      # load-bearing as the comparator: a regex that stops matching shrinks what the
      # check asserts without failing anything.
      - 'scripts/ci/derive-intended-schema.mjs'
      # The predicate comparator and its scratch-database harness (#1062 step 2).
      - 'scripts/ci/policy-predicates.mjs'
      - '.github/workflows/prod-schema-drift.yml'
  workflow_dispatch:

concurrency:
  group: prod-schema-drift
  cancel-in-progress: false

jobs:
  drift:
    name: Production schema matches the repo
    runs-on: ubuntu-latest
    # 25, not 10: the predicate step pulls a ~1GB Postgres image and builds a database
    # from the migration. Measured at ~90s locally with the image cached, so the ceiling is
    # dominated by the pull on a cold runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      # IS THERE A PROJECT TO INTERROGATE? (#985)
      #
      # A fresh fork has no Supabase project, so this asked a live API about nothing
      # and failed. A step, not a job-level `if:`, because half the pair is a secret
      # and the `secrets` context is not available in a job-level condition.
      #
      # THE HARDCODED FALLBACK IS GONE, and that is the other half of this change.
      # The `||` default pointed every fork's CI at THIS project's ref — so a fork was
      # not merely failing, it was failing while
      # asking questions about somebody else's database. The variable is set on this
      # repository to exactly that value, so removing the default changes nothing here.
      #
      # HALF-CONFIGURED STILL FAILS: neither set is "no project yet"; exactly one set
      # is a misconfiguration, and letting it skip would mean deleting the token
      # silently retires a daily gate.
      - name: Is a Supabase project configured?
        id: configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "  Supabase project configured — the drift check will run"
            exit 0
          fi
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] && [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Supabase project configured, so there is no production schema to compare against. Set the SUPABASE_PROJECT_REF repository VARIABLE and the SUPABASE_ACCESS_TOKEN repository SECRET to enable this check."
            exit 0
          fi
          echo "::error::Supabase is half-configured, which is not the same as unconfigured."
          [ -n "$SUPABASE_PROJECT_REF" ] || echo "::error::  missing repository VARIABLE  SUPABASE_PROJECT_REF"
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || echo "::error::  missing repository SECRET    SUPABASE_ACCESS_TOKEN"
          exit 1

      # TWO INDEPENDENT DETECTORS, TWO INDEPENDENT VERDICTS.
      #
      # They ask different questions with different instruments -- one compares production
      # against an intent PARSED from the migration, the other against a scratch database
      # BUILT from it -- so neither may hide the other behind a shared exit code. `id:` plus
      # `if: !cancelled()` is the pattern smoke.yml adopted in #1066, after a single failing
      # detector masked seven passing ones for three days and nobody could tell which was
      # which (#1061).

      # No install step: the checker uses built-in fetch and imports nothing.
      - name: Compare production against INTENDED
        id: intended
        if: ${{ !cancelled() && steps.configured.outputs.configured == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/ci/check-prod-schema-drift.mjs

      # Docker is preinstalled on ubuntu-latest; this step needs it, and nothing else.
      - name: Compare what the policies SAY (#1062)
        id: predicates
        if: ${{ !cancelled() && steps.configured.outputs.configured == 'true' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: node scripts/ci/policy-predicates.mjs

      - name: Which detectors passed
        if: ${{ !cancelled() && steps.configured.outputs.configured == 'true' }}
        run: |
          printf '%-10s %s\n' \
            "${{ steps.intended.outcome }}" "Production matches the intent parsed from the migration" \
            "${{ steps.predicates.outcome }}" "Every policy SAYS the same thing on both sides (#1062)"
        shell: bash
