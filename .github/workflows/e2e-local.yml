# Quoted deliberately: an unquoted `#` after whitespace starts a YAML comment,
# which silently truncated this name to "E2E (local Supabase) —".
name: 'E2E (local Supabase) — #575 prototype'

# PROTOTYPE. Runs ALONGSIDE e2e.yml, never instead of it, until a full parity
# run proves the two produce the same pass/fail set. Do not delete e2e.yml, do
# not remove its mutex, and do not treat a green run here as coverage yet.
#
# NOW THE FULL 24-JOB MATRIX (#575 step 1). It mirrors e2e.yml's three matrices
# exactly — same projects, same shard counts, same `workers: 2` on the msg-iso
# entries — because parity is only meaningful if the two run the SAME work.
#
# What it does NOT mirror is the contention machinery. e2e.yml splits into three
# per-browser jobs each capped at `max-parallel: 2` for one reason: to hold peak
# load on the single shared CLOUD project down to 6 concurrent shards. Every
# runner here brings up its own Supabase, so there is nothing to contend for and
# all 24 can run at once. Copying the caps would import the bottleneck this
# workflow exists to delete.
#
# WHY THIS EXISTS
# Every painful property of e2e.yml traces to one fact: all 24 matrix jobs share
# a single CLOUD Supabase project. The repo-wide mutex, `max-parallel: 2`, the
# connection-priming curl and the up-to-50s stagger sleep are all workarounds for
# contention on that one project. Measured cost: 68-min median, 25% of runs
# cancelled at the 60-min job cap while queued, and #567 — CI exhausting the
# production quota and taking prod down with it.
#
# A per-runner ephemeral stack has no contention, so none of those workarounds
# are needed. Note what is ABSENT below: no `concurrency:` block at all.
#
# PROVEN LOCALLY 2026-08-06, while the cloud project was returning HTTP 402:
#   local  /auth/v1/health -> 200      cloud -> 402
#   public tables          -> 17       (identical to production)
#   seed-test-users.ts     -> all four users created
#   global-setup           -> "Sign-in successful", auth state saved
#   mobile-check.spec.ts   -> 2 passed (16.4s)
# global-setup is the exact gate that aborts on cloud with exceed_*_quota.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit to TEST (workflow definition still comes from the branch you dispatch)'
        required: false
        default: de0f7f080c8d75949e4e6c89fdf66ab7d3da8029
  # Dispatching with --ref de0f7f0 would run THAT commit's copy of this file — the
  # old single-shard prototype — so the widened matrix could never reach the
  # baseline code. Checking the ref out as an INPUT instead keeps the two
  # separable: definition from the branch, code under test from `ref`.
  # EVERY PR AND EVERY PUSH TO MAIN, WITH NO `paths` FILTER OF ANY KIND (#575 Phase 3).
  #
  # The filtering happens in the `changes` job below instead, and that placement is the
  # whole point. This workflow's aggregate becomes a REQUIRED check in Phase 5, and a
  # required check that never reports is **pending forever**, not skipped — which is
  # precisely why `Build` and `Validate Component Structure` are deliberately absent from
  # this repo's required set. A `paths:`/`paths-ignore:` here would make every docs-only PR
  # permanently unmergeable.
  #
  # So: trigger always, decide inside, and let the aggregate report success when there was
  # nothing to run.
  pull_request:
    branches: [main]
  push:
    branches: [main]

# DELIBERATELY NO `concurrency:` BLOCK.
# e2e.yml serializes every run repo-wide because they contend for one cloud
# project. Nothing is shared here, so runs may go in parallel. Re-adding a mutex
# would reintroduce the bottleneck this workflow exists to remove.

jobs:
  # Does this change need the suite at all? (#575 Phase 3)
  #
  # Reads the ignore list OUT OF `e2e.yml` rather than repeating it — two lanes with two
  # hand-maintained lists drift silently, and in the worst direction: a change that skips E2E
  # on one lane and runs it on the other. Deriving means they cannot disagree.
  changes:
    name: Does this change need E2E?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the PR case diffs against the merge base, which a shallow
          # clone does not contain.
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Decide
        id: decide
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # An explicit dispatch is a deliberate request — never second-guess it.
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "  workflow_dispatch — running unconditionally"
            exit 0
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            # push: `before` is all-zeroes on a branch's first push — fall back to the
            # first parent so the diff is never taken against a nonexistent object.
            BASE="${{ github.event.before }}"
            case "$BASE" in
              0000000*|'') BASE="$(git rev-parse HEAD^1 2>/dev/null || git rev-parse HEAD)" ;;
            esac
            HEAD="${{ github.sha }}"
          fi
          echo "  base=$BASE head=$HEAD"
          node scripts/ci/e2e-local-changes.mjs "$BASE" "$HEAD"

  e2e-local:
    name: ${{ matrix.project }} ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # 45, not 30 (#801) — and this cap BOUNDS DAMAGE, it does not guarantee completion.
    # Saying otherwise would be the mistake #762 and #798 both made.
    #
    # There is no value that guarantees completion, because the quantity is a download
    # over a mirror of unknown speed: `firefox-gen 4/6` moved 21.1 MB at 36.9 kB/s on
    # 2026-08-18, and webkit's 114 MB at that rate is **51 minutes**. 45 would not have
    # saved it either.
    #
    # What 45 buys is the ordinary cold-cache miss (a 17.7m install inside a ~25m job),
    # which 30 was already too tight for. The real fix is the apt cache below, which
    # removes the download rather than budgeting for it. If WARM runs ever approach this
    # cap, the cache has stopped working — check the mirror bytes, not the duration.
    #
    # A job-level cap is also the one bound that cannot leave a poisoned runner behind,
    # because the runner is destroyed with it. That is why this is the right place for a
    # time bound and the install command is not (#798).
    timeout-minutes: 45

    strategy:
      # NO max-parallel. See the header — the caps in e2e.yml protect a shared
      # cloud project that does not exist here.
      fail-fast: false
      matrix:
        include:
          # ===== CHROMIUM =====
          - { project: chromium-msg, browser: chromium, shard: 1/1 }
          - {
              project: chromium-msg-iso,
              browser: chromium,
              shard: 1/1,
              workers: 2,
            }
          - { project: chromium-gen, browser: chromium, shard: 1/6 }
          - { project: chromium-gen, browser: chromium, shard: 2/6 }
          - { project: chromium-gen, browser: chromium, shard: 3/6 }
          - { project: chromium-gen, browser: chromium, shard: 4/6 }
          - { project: chromium-gen, browser: chromium, shard: 5/6 }
          - { project: chromium-gen, browser: chromium, shard: 6/6 }
          # ===== FIREFOX =====
          - { project: firefox-msg, browser: firefox, shard: 1/1 }
          - {
              project: firefox-msg-iso,
              browser: firefox,
              shard: 1/1,
              workers: 2,
            }
          - { project: firefox-gen, browser: firefox, shard: 1/6 }
          - { project: firefox-gen, browser: firefox, shard: 2/6 }
          - { project: firefox-gen, browser: firefox, shard: 3/6 }
          - { project: firefox-gen, browser: firefox, shard: 4/6 }
          - { project: firefox-gen, browser: firefox, shard: 5/6 }
          - { project: firefox-gen, browser: firefox, shard: 6/6 }
          # ===== WEBKIT =====
          - { project: webkit-msg, browser: webkit, shard: 1/1 }
          - { project: webkit-msg-iso, browser: webkit, shard: 1/1, workers: 2 }
          - { project: webkit-gen, browser: webkit, shard: 1/6 }
          - { project: webkit-gen, browser: webkit, shard: 2/6 }
          - { project: webkit-gen, browser: webkit, shard: 3/6 }
          - { project: webkit-gen, browser: webkit, shard: 4/6 }
          - { project: webkit-gen, browser: webkit, shard: 5/6 }
          - { project: webkit-gen, browser: webkit, shard: 6/6 }

    steps:
      - name: Checkout the code under test
        uses: actions/checkout@v5
        with:
          # Empty on pull_request → the PR head, as usual.
          ref: ${{ inputs.ref || github.sha }}

      - name: Say plainly what is being tested
        run: |
          echo "workflow definition : ${{ github.sha }}"
          echo "code under test     : $(git rev-parse HEAD)"

      - name: Local demo env (compose + build + tests share one set of creds)
        run: |
          # .env.local-supabase is TRACKED and holds the well-known PUBLIC
          # Supabase demo keys. No repository secret is used anywhere in this
          # workflow — which is the point: CI stops holding a production
          # service-role key at all (see #574).
          cp .env.local-supabase .env
          sed -i 's|host\.docker\.internal|localhost|g' .env
          grep -E '^(NEXT_PUBLIC_SUPABASE_ANON_KEY|SUPABASE_SERVICE_ROLE_KEY|TEST_USER_)' .env.local-supabase >> "$GITHUB_ENV"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=http://localhost:54321"
            echo "SUPABASE_ADMIN_URL=http://localhost:54321"
          } >> "$GITHUB_ENV"

      - name: Bring up local Supabase
        run: |
          # THE SERVICE LIST MUST NOT ASSUME THE CHECKED-OUT CODE HAS IT.
          #
          # This workflow's DEFINITION comes from the branch; docker-compose.yml
          # comes from `ref`. supabase-edge-runtime was added in c30dc06d (#598),
          # AFTER the de0f7f0 parity baseline — so naming it unconditionally made
          # `docker compose up` fail with "no such service" and killed all 25 jobs
          # before a single test ran. Any service added after the baseline has the
          # same shape, so ask the compose file rather than hard-coding.
          SERVICES="supabase-db supabase-kong supabase-auth supabase-rest supabase-realtime supabase-storage"
          if docker compose --profile supabase config --services 2>/dev/null | grep -qx 'supabase-edge-runtime'; then
            # kong.yml routes /functions/v1/ at it; without it every Edge Function
            # call is a Kong 5xx against an unresolvable upstream, which surfaces
            # as a PRODUCT error ("Failed to retry payment") rather than as
            # anything pointing at a missing container.
            SERVICES="$SERVICES supabase-edge-runtime"
            echo "EDGE_RUNTIME_PRESENT=1" >> "$GITHUB_ENV"
          else
            echo "EDGE_RUNTIME_PRESENT=0" >> "$GITHUB_ENV"
            echo "::notice::this commit predates the local edge runtime (#598) — Edge Function specs cannot pass here"
          fi
          echo "starting: $SERVICES"
          docker compose --profile supabase up -d $SERVICES

      - name: Wait for the stack to answer
        run: |
          set +e   # a non-zero curl inside the loop must not kill the step
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
              http://localhost:54321/auth/v1/health)
            [ "$code" = "200" ] && { echo "auth ready after ${i} attempt(s)"; break; }
            sleep 3
          done
          [ "$code" = "200" ] || { echo "::error::local Supabase never became ready (last=$code)"; exit 1; }

          # And the functions route, when this commit HAS an edge runtime. A
          # missing one does not stop /auth/v1/health answering, so the wait above
          # passes while every Edge Function call 5xxs — the exact way this stayed
          # invisible.
          #
          # PROBE A FUNCTION THAT ACTUALLY EXISTS.
          #
          # This used to request `__readiness_probe__` — a name that appears
          # nowhere else in the repo, because the function was never created. The
          # comment here asserted that a missing function returns 404, so 4xx was
          # read as "runtime is up". supabase/edge-runtime returns **500**:
          #
          #   {"error":"Function '__readiness_probe__' could not be started",
          #    "detail":"worker boot error: failed to read path: (os error 2)",
          #    "hint":"Expected supabase/functions/__readiness_probe__/index.ts to exist"}
          #
          # So the probe declared the runtime dead on every run while the runtime
          # was healthy — reproduced locally, `create-order` answers 401 on the very
          # same stack. It failed all 25 jobs at the gate and #575's parity matrix
          # never executed a single test.
          #
          # Probing a REAL function also makes this a stronger check than before:
          # 401 proves Kong routed, the worker booted, and the function ran far
          # enough to reject an unauthenticated call.
          if [ "${EDGE_RUNTIME_PRESENT:-0}" = "1" ]; then
            PROBE_FN=create-order
            if [ ! -f "supabase/functions/${PROBE_FN}/index.ts" ]; then
              echo "::error::probe target supabase/functions/${PROBE_FN}/index.ts does not exist. Point PROBE_FN at a function that does — probing a name that is not there is what broke this probe in the first place."
              exit 1
            fi
            for i in $(seq 1 30); do
              fc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                -H "apikey: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}" \
                "http://localhost:54321/functions/v1/${PROBE_FN}")
              case "$fc" in 2*|4*) echo "edge runtime reachable after ${i} attempt(s) — ${PROBE_FN} answered HTTP $fc"; break;; esac
              sleep 3
            done
            case "$fc" in
              2*|4*) ;;
              *) echo "::error::edge runtime never became reachable through Kong (${PROBE_FN} last=$fc) — Edge Function specs would fail as product errors"; exit 1 ;;
            esac
          else
            echo "edge runtime absent at this commit — skipping its readiness probe"
          fi

      - name: Assert schema fidelity before trusting any result
        run: |
          # docker-compose.yml mounts the SAME monolithic migration production
          # uses, as a file rather than a directory. If that ever silently stops
          # applying, every test below would pass against an empty database and
          # report green — the #396 shape. Fail loudly instead.
          n=$(docker compose exec -T supabase-db psql -U postgres -d postgres -tAc \
                "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables: $n"
          [ "$n" -ge 17 ] || { echo "::error::expected >=17 public tables, got $n — migration did not apply"; exit 1; }

      - name: Setup Node + pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1
      - uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Seed the E2E users
        run: pnpm tsx scripts/seed-test-users.ts

      - name: Build (root-served, pointed at the local stack)
        run: pnpm build
        env:
          DISABLE_BASE_PATH: 'true'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_e2e_dummy_not_a_real_key
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: e2e_dummy_paypal_client_id
          # NEXT_PUBLIC_CAPTCHA_SITE_KEY is deliberately ABSENT — do not copy it
          # from e2e.yml.
          #
          # `captcha.config.ts:62` derives `enabled: Boolean(siteKey)`, so setting
          # the key is what makes the CLIENT demand a token. The local GoTrue never
          # asked for one (docker-compose.yml sets no GOTRUE captcha vars). The
          # first run of this workflow set it anyway, copied from e2e.yml, and
          # every auth test failed with "Please complete the verification
          # challenge" — a challenge nothing on the server side wanted.
          #
          # e2e.yml sets it for an unrelated reason: #488's 320px width gate needs
          # the widget to actually render against the cloud stack. That reason does
          # not apply here. `signup-mailer.yml`, which drives real auth forms
          # against this same local stack, also omits it — follow that precedent.

      # CACHE THE APT ARCHIVES, BECAUSE THE DOWNLOAD IS THE JOB (#801).
      #
      # Measured 2026-08-18, run 32123025570, `webkit-msg 1/1` (25-minute job):
      #
      #   apt-get update                11s   11.3 MB @ 7407 kB/s   <- never the problem
      #   apt-get install FETCH      16m09s    114 MB @  118 kB/s   <- this is the job
      #   dpkg unpack/configure         70s
      #   browsers from Playwright CDN   8s                          <- never the problem
      #
      # IT IS NOT A WEBKIT PROBLEM, and scoping this to webkit later would be wrong.
      # Every `Fetched` line from that same run:
      #
      #   chromium-gen 3/6    21.1 MB in 2s        (8454 kB/s)
      #   firefox-gen  5/6    21.1 MB in 0s        (86.4 MB/s)
      #   firefox-gen  4/6    21.1 MB in 9min 32s  (36.9 kB/s)   <- 21 MB. nine minutes.
      #   webkit-gen   1/6     114 MB in 3s        (43.2 MB/s)
      #   webkit-msg   1/1     114 MB in 16min 09s (118 kB/s)
      #
      # Identical work, 800x spread. Every job holds a lottery ticket; webkit just has a
      # bigger downside. At firefox's observed 36.9 kB/s, webkit's 114 MB would take 51
      # minutes — which is why no job timeout can be "sized for the cold path".
      #
      # WHY A CACHE AND NOT ANOTHER BOUND. #762 and #798 tried to bound the TIME apt
      # spends. Time is the mirror's to choose. Bytes are ours. In that same job, at that
      # same minute, the Actions cache service delivered 318 MB at 95 MB/s while
      # azure.archive.ubuntu.com delivered 118 kB/s to the same VM.
      #
      # A STALE CACHE IS STILL VALUABLE HERE, unlike most caches: apt matches per FILE,
      # so a near-miss restore means "download only what changed" rather than "download
      # everything". That is why the restore-keys ladder below is load-bearing rather
      # than decorative — it turns a runner-image bump from a 114 MB event into a delta.
      - name: Resolve the apt cache key
        id: cachekey
        run: |
          set -euo pipefail

          # ImageOS/ImageVersion are ambient runner environment variables, NOT a
          # documented expression context. Read them here rather than via `env.*`: if
          # they resolved empty the key would silently degenerate to `apt-webkit---`,
          # HIT FOREVER across image bumps, and re-fetch the delta from the mirror on
          # every job behind a green "Cache restored" line. Fail instead.
          : "${ImageOS:?empty — the cache key would silently never rotate}"
          : "${ImageVersion:?empty — the cache key would silently never rotate}"

          # Hash the dep list PLAYWRIGHT ITSELF would install, not the package.json
          # range. `^1.55.0` does not change when the lockfile resolves 1.55.2, and the
          # dep set is what the cache actually holds. This derives the value from
          # Playwright instead of restating it, so it cannot drift. Verified
          # deterministic, and distinct per browser (chromium/firefox/webkit each hash
          # differently).
          DEPS=$(pnpm exec playwright install-deps --dry-run chromium ${{ matrix.browser }} | sha256sum | cut -c1-16)

          KEY="apt-${{ matrix.browser }}-${ImageOS}-${ImageVersion}-${DEPS}"
          {
            echo "key=$KEY"
            # browser FIRST so both fallbacks are true prefixes of the primary key.
            # Reversing browser and ImageVersion silently disables the ladder.
            echo "prefix1=apt-${{ matrix.browser }}-${ImageOS}-${ImageVersion}-"
            echo "prefix2=apt-${{ matrix.browser }}-${ImageOS}-"
          } >> "$GITHUB_OUTPUT"

          # Echoed so a degenerate key is VISIBLE rather than inferred later.
          echo "apt cache key: $KEY"

      # restore/save split rather than `actions/cache@v4`, deliberately: that action
      # saves with `post-if: success()`, so a shard whose TESTS fail would never
      # refresh the cache — going stale exactly on a lane that fails often. The save
      # below is gated on the INSTALL succeeding, which is the thing being cached.
      - name: Restore cached apt packages
        id: aptcache
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-deb-cache
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: |
            ${{ steps.cachekey.outputs.prefix1 }}
            ${{ steps.cachekey.outputs.prefix2 }}

      - name: Seed apt's archive from the cache
        run: |
          set -euo pipefail
          # Staged through a user-owned directory on purpose: actions/cache runs as
          # `runner`, and /var/cache/apt/archives is root-owned (with partial/ at 0700
          # root), so caching it directly fails on both save and restore.
          #
          # apt matches on exact filename and verifies the hash against its index, so a
          # stale .deb is ignored and re-downloaded rather than used. There is no
          # corruption path here, only a slower one.
          if compgen -G "$HOME/apt-deb-cache/*.deb" > /dev/null; then
            n=$(ls -1 "$HOME"/apt-deb-cache/*.deb | wc -l)
            sudo cp -n "$HOME"/apt-deb-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            echo "seeded $n cached .deb(s)  (restore key: ${{ steps.aptcache.outputs.cache-matched-key }})"
          else
            echo "cold cache — apt will fetch from the mirror this run"
          fi

      - name: Install Playwright (chromium + ${{ matrix.browser }})
        id: pwinstall
        run: |
          # CHROMIUM IS NOT OPTIONAL ON A FIREFOX OR WEBKIT JOB.
          #
          # Every *-gen / *-msg project declares `dependencies: ['setup']`, and
          # auth.setup.ts runs in CHROMIUM. Installing only the matrix browser
          # makes setup fail to launch — and Playwright then SKIPS every dependent
          # test rather than failing it. The first full-matrix run reported all 24
          # jobs green with firefox and webkit at passed=0, 667 skipped each, "no
          # reason recorded". Only the parity count check caught it (#396 shape).
          #
          # e2e.yml gets away with `--with-deps "$BROWSER"` because it runs ONE
          # shared Auth Setup job and passes storage-state-auth.json to the matrix
          # as an artifact. That cannot work here: every runner has its own
          # Supabase with its own users, so a state minted on another runner is
          # worthless. Each job runs its own setup, so each job needs chromium.
          # MAKE APT GIVE UP, RATHER THAN KILLING IT FROM OUTSIDE (#798, after #762).
          #
          # The failure mode is a HANG, not an error: `--with-deps` shells out to
          # `apt-get` as root, and an unreachable mirror makes apt WAIT. `&& break`
          # retries on a non-zero EXIT, so a hang meant `i` never reached 2 and the
          # three attempts written to survive a bad install could never run. Eight
          # jobs sat here ~26 minutes on run 32088862298 and were killed by the cap
          # having run zero tests (#762).
          #
          # #762 was fixed with `timeout 300` around the command. THAT WAS THE WRONG
          # SHAPE and it broke the next PR through the lane (#798, run 32107363501):
          #
          #   * It cannot tell STALLED from SLOW. apt was downloading fonts the whole
          #     time — 3.5 MB, 5.6 MB, 3.0 MB, each `Get:` line real progress — and
          #     was killed mid-download at 300s. #762's actual hang was 26 minutes of
          #     total SILENCE. A wall-clock bound sees those as identical.
          #   * It ORPHANS apt. `timeout` signals the `pnpm exec` wrapper; the
          #     `apt-get` beneath runs as ROOT and survives, still holding
          #     /var/lib/dpkg/lock-frontend. Attempts 2 and 3 then died in ~1 second
          #     each on "Could not get lock ... held by process 8901". The timeout
          #     poisoned the very retries it was added to make work.
          #
          # RESIZING THE BOUND WAS TRIED TWICE AND FAILED TWICE. 300s broke #797;
          # 480s plus apt timeouts plus a dpkg-lock wait broke #799 the same way
          # (run 32110561758): the install was STILL DOWNLOADING at 480s, the
          # orphaned apt was still running when the 60s lock-wait gave up, and both
          # retries died on its lock. There is no safe number, because the quantity
          # being bounded is a download over a mirror of unknown speed.
          #
          # SO THERE IS NO WALL-CLOCK BOUND HERE, DELIBERATELY. Do not add one back.
          # It cannot tell slow from stalled, and killing apt mid-download leaves a
          # root process holding /var/lib/dpkg/lock-frontend that poisons every retry
          # after it. It has now cost two PRs and fixed nothing.
          #
          # What actually bounds this, in layers that CAN observe what they bound:
          #
          #   apt's own Acquire timeouts  -> a STALLED mirror exits non-zero in ~60s,
          #                                  no orphan, no held lock, and the retry
          #                                  loop below handles it. This is the #762
          #                                  fix, and it is the load-bearing one.
          #   the apt-deb cache above     -> removes the download entirely on a warm
          #                                  cache, which is where the 14m51s went
          #                                  (#801). Not a bound, but the reason the
          #                                  bounds below rarely matter.
          #   timeout-minutes: 45         -> the outer backstop, sized for the COLD
          #                                  cache path. A job-level cap is the only
          #                                  bound that cannot leave a poisoned
          #                                  runner behind — the runner dies with it.
          # `Keep-Downloaded-Packages "true"` is what makes the cache possible at all:
          # apt-get keeps its archives today, but only because nothing turned that off.
          # If a future runner image flips it, the cache would save nothing and no test
          # would notice — so pin it here rather than inherit it (#801).
          printf 'Acquire::http::Timeout "20";\nAcquire::https::Timeout "20";\nAcquire::Retries "3";\nAPT::Keep-Downloaded-Packages "true";\n' \
            | sudo tee /etc/apt/apt.conf.d/99-ci-network-timeouts >/dev/null

          # `pipefail` is not optional here. Without it the pipeline returns tee's
          # status, the check below always passes, and a failed install resurfaces as a
          # test failure — the exact confusion the loud failure underneath was written
          # to prevent.
          set -o pipefail
          ok=0
          for i in 1 2 3; do
            if pnpm exec playwright install --with-deps chromium ${{ matrix.browser }} \
                 2>&1 | tee "$RUNNER_TEMP/pw-install.log"; then
              ok=1
              break
            fi
            echo "Retry $i: playwright install failed, retrying in 10s..."
            sleep 10
          done
          # Fail loudly rather than falling through. Without this the loop simply
          # ends, the test step launches browsers that were never installed, and the
          # shard fails somewhere else entirely — which is how an install problem
          # gets diagnosed as a test problem.
          if [ "$ok" -ne 1 ]; then
            echo "::error::playwright install did not succeed in 3 attempts (#762, #798)"
            exit 1
          fi


      # MEASURE THE BYTES THAT LEFT THE MIRROR (#801).
      #
      # The previous version of this change asserted nothing. It carried a comment
      # saying `Need to get N MB` was "the honest measure" and then never read it —
      # which is the same shape as #459 (axe-core returning a pass with
      # contrastRatio: null) and as every probe this repo has been burned by.
      #
      # apt prints exactly one of:
      #     Need to get 114 MB of archives.          <- all of it from the mirror
      #     Need to get 0 B/114 MB of archives.      <- first number is the mirror's share
      #
      # That FIRST number is the only honest signal. Step duration is not: a fast mirror
      # produces the same duration as a working cache, which is precisely how #757
      # survived three occurrences.
      - name: How many bytes actually came from the mirror
        if: always() && steps.pwinstall.outcome == 'success'
        env:
          CACHE_HIT: ${{ steps.aptcache.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.aptcache.outputs.cache-matched-key }}
          BROWSER: ${{ matrix.browser }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, pathlib

          log = pathlib.Path(os.environ["RUNNER_TEMP"]) / "pw-install.log"
          text = log.read_text(errors="replace") if log.exists() else ""

          UNITS = {"B": 1, "kB": 10**3, "MB": 10**6, "GB": 10**9}
          m = re.search(r"^Need to get ([\d.]+) ?([kMG]?B)(?:/([\d.]+) ?([kMG]?B))?", text, re.M)
          if m:
              mirror = float(m.group(1)) * UNITS[m.group(2)]
              total = float(m.group(3)) * UNITS[m.group(4)] if m.group(3) else mirror
              line = m.group(0)
          else:
              # No line at all means apt had nothing to install — a legitimate outcome,
              # not a measurement failure. Say which it was rather than defaulting.
              mirror = total = 0.0
              line = "(no 'Need to get' line — nothing needed installing)"

          hit = os.environ.get("CACHE_HIT") == "true"
          metrics = {
              "browser": os.environ.get("BROWSER"),
              "cache_hit": hit,
              "matched_key": os.environ.get("MATCHED_KEY") or None,
              "mirror_bytes": int(mirror),
              "total_bytes": int(total),
          }
          pathlib.Path("apt-metrics.json").write_text(json.dumps(metrics))

          print(f"apt: {line}")
          print(f"from the mirror: {mirror/1e6:.1f} MB   cache hit: {hit}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write(f"- apt from mirror: **{mirror/1e6:.1f} MB** "
                           f"(cache hit: {hit}, baseline 2026-08-18: 114 MB webkit / 21 MB other)\n")

          # WHY A WARNING AND NOT A HARD FAILURE, stated so nobody "tightens" it without
          # reading this. The key hashes the dependency NAMES Playwright asks for, not
          # their resolved versions, so a security update inside one ImageVersion can
          # legitimately produce a small delta on an exact key hit. Erroring here would
          # red the lane for a correct apt. A LARGE fetch on an exact hit is the real
          # signal — that means the key is degenerate or the archive is not being kept.
          if hit and mirror > 8e6:
              print(f"::warning::exact cache hit but {mirror/1e6:.1f} MB still came from "
                    f"the mirror — the key may be degenerate, or apt is discarding its "
                    f"archives. See #801.")
          PY

      - name: Hand the debs back to the cache
        if: always() && steps.pwinstall.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/apt-deb-cache"
          # Prune first. `restore-keys` carries the previous generation forward and
          # `cp -n` never removes anything, so without this the cache accumulates every
          # version ever seen and eventually evicts the pnpm cache under the repo's LRU.
          # `autoclean` drops only .debs the current index no longer offers.
          sudo apt-get -o Dir::Cache::archives="$HOME/apt-deb-cache/" autoclean || true
          sudo cp -n /var/cache/apt/archives/*.deb "$HOME/apt-deb-cache/" 2>/dev/null || true
          # MANDATORY: the copies land root-owned and actions/cache runs as `runner`,
          # which would otherwise fail to tar them.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/apt-deb-cache"
          echo "cached $(ls -1 "$HOME"/apt-deb-cache/*.deb 2>/dev/null | wc -l) .deb(s) for next time"

      # Saved explicitly rather than by `actions/cache`'s post step, which is gated on
      # the whole JOB succeeding — a shard whose tests fail would never refresh the
      # cache, going stale exactly on a lane that fails often. This is gated on the
      # INSTALL succeeding, which is what is actually being cached.
      #
      # `continue-on-error` covers the concurrent-save race: eight jobs share each key,
      # the first to reserve wins, and the rest get a 409 the action reports as info.
      # Making that explicit rather than inherited.
      - name: Save the apt cache
        if: always() && steps.pwinstall.outcome == 'success' && steps.aptcache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/apt-deb-cache
          key: ${{ steps.cachekey.outputs.key }}

      - name: Run ${{ matrix.project }} ${{ matrix.shard }}
        run: |
          npx serve out -l 3000 &
          npx wait-on http://localhost:3000 --timeout 60000
          # JSON as well as line: parity is decided on COUNTS, and the line
          # reporter's summary is not machine-readable. `|| true` so a failing
          # shard still uploads its results — a parity run that discards the
          # numbers from the shards that failed cannot diagnose the mismatch,
          # which is the only reason to do the run at all. The parity job below
          # is what fails the workflow.
          # Mirrors e2e.yml:791-801 exactly. `workers` is a CLI FLAG, not an env
          # var the config reads — playwright.config.ts hardcodes `workers: 1` on
          # CI (:88) and only the per-job `--workers` flag lifts the iso shards to
          # 2. Passing it as an unread env var would silently run msg-iso serially,
          # changing results on the one project whose whole point is parallelism —
          # and quietly breaking the parity comparison this run exists to make.
          WORKERS_FLAG=""
          if [ -n "$WORKERS" ]; then
            WORKERS_FLAG="--workers=$WORKERS"
          fi
          # `@hosted` = needs a REAL Supabase project (#725). Six tests in
          # tests/e2e/security/oauth-csrf.spec.ts wait for a redirect to github.com /
          # google.com, which a local stack never performs — 18 of the 19 failures this
          # lane reported once #732 let it report anything. They are excluded here and
          # still run in e2e.yml, which is unfiltered.
          #
          # A CLI FLAG, NOT `playwright.config.ts`. Both lanes load the same config and
          # name the same projects, so a project-level `grepInvert` would hide these from
          # the HOSTED lane too — the one place they can actually pass. A top-level config
          # `grep` is worse: it filters the `setup` project as well, and setup dying is
          # exactly what once produced 24 green jobs with 0 tests executed.
          pnpm exec playwright test \
            --project=${{ matrix.project }} --shard=${{ matrix.shard }} \
            $WORKERS_FLAG \
            --grep-invert='@hosted' \
            --reporter=line,json || true
        env:
          CI: 'true'
          SKIP_WEBSERVER: 'true'
          BASE_URL: http://localhost:3000
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
          WORKERS: ${{ matrix.workers }}
          # EVERY JOB MUST DO ITS OWN FULL SETUP (#575).
          #
          # auth.setup.ts:146 gates the second half of setup on
          # `!CI || AUTH_SETUP_JOB === 'true'`. e2e.yml can leave it unset on its
          # matrix because it runs ONE dedicated Auth Setup job and hands
          # storage-state-auth-b.json to the shards as an artifact. That is
          # impossible here: every runner brings up its own Supabase with its own
          # users, so a state minted on another runner is worthless.
          #
          # Unset, the gate is false on all 24 jobs and silently skips User B's
          # storage state, encryption-key creation, display-name backfill, the
          # PRIMARY↔TERTIARY/SECONDARY connections and the seeded conversation.
          # The parity run showed that as 52 failures with skipped drifting
          # 194 → 215. The "User B env vars missing" log is a red herring —
          # execution never reaches that branch, so the message never printed and
          # the env vars were fine all along.
          #
          # AND THE REASON THE GATE EXISTS DOES NOT APPLY HERE. auth.setup.ts:144
          # says it plainly: "Skip in per-shard runs to avoid 6 concurrent
          # cleanups." That is a SHARED-BACKEND hazard — concurrent cleanups on one
          # cloud project delete each other's fixtures mid-run, which is the #85
          # class that cost nine rounds of flake patching. Here each job owns its
          # own database, so 24 concurrent cleanups touch 24 separate datasets and
          # cannot race. Setting this on e2e.yml's matrix would still be wrong.
          #
          # Same architectural consequence as needing chromium on every shard:
          # per-runner stacks mean per-job setup.
          AUTH_SETUP_JOB: 'true'

      - name: This shard must have executed something, and it must have passed
        if: always()
        run: |
          # `|| true` above is deliberate — a failing shard still has to upload its
          # numbers or a mismatch cannot be diagnosed. The cost is that a shard
          # which ran NOTHING looks exactly like one that passed.
          #
          # That is not hypothetical: the first full-matrix run showed 24 green
          # jobs while firefox and webkit executed zero tests each (setup could not
          # launch, so every dependent test was skipped rather than failed). Only
          # the aggregate parity check noticed. A green tick per shard is read far
          # more often than a count at the end, so make the shard itself say so.
          #
          # AND IT MUST FAIL ON FAILURES (#732). This step used to check only
          # `ran == 0`, which meant `|| true` swallowed the exit code and NOTHING
          # downstream on a normal PR restored it: run 31447148386 logged
          # `passed 1863 · failed 21` and every job, and the run, concluded success.
          # The old counter also called a FAILED test "ran", so 21 failures read as
          # 21 successful executions. Counting the exit code instead would be the
          # obvious fix and is strictly worse: it cannot tell a crash from a failure,
          # and it reports a number instead of a name.
          python3 - <<'EOF'
          import json, sys
          try:
              d = json.load(open("results.json"))
          except Exception as e:
              print(f"::error::no readable results.json ({e}) — this shard reported nothing")
              sys.exit(1)
          ran = skipped = failed = 0
          names = []
          def walk(s):
              global ran, skipped, failed
              for spec in s.get("specs", []):
                  for t in spec.get("tests", []):
                      st = t.get("status")   # expected|skipped|flaky|unexpected
                      if st == "skipped":
                          skipped += 1
                          continue
                      ran += 1
                      # `flaky` passed on retry. It is tracked in the aggregate but is
                      # not a shard failure — that policy lives in the flaky gate.
                      if st not in ("expected", "flaky"):
                          failed += 1
                          names.append(spec.get("title", "?"))
              for c in s.get("suites", []): walk(c)
          for s_ in d.get("suites", []): walk(s_)
          print(f"executed {ran}, skipped {skipped}, failed {failed}")
          if ran == 0:
              print(f"::error::this shard executed 0 tests ({skipped} skipped) — "
                    "a green tick here would be meaningless. Usual cause: the `setup` "
                    "dependency could not launch, so Playwright skipped everything "
                    "downstream instead of failing.")
              sys.exit(1)
          if failed:
              for n in names[:10]:
                  print(f"::error::failed: {n}")
              print(f"::error::this shard had {failed} failing test(s) — see above")
              sys.exit(1)
          EOF

      - name: Name this shard's artifact
        if: always()
        id: slug
        run: echo "id=${{ matrix.project }}-$(echo '${{ matrix.shard }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          # 24 jobs uploading `e2e-local-report` would collide; upload-artifact v4+
          # errors on a duplicate name, so every shard needs its own.
          name: e2e-local-${{ steps.slug.outputs.id }}
          path: |
            playwright-report/
            results.json
            apt-metrics.json
          retention-days: 3

  # ==========================================================================
  # PARITY — the only thing that makes this run worth doing (#575 step 2)
  # ==========================================================================
  #
  # "All 24 jobs went green" is NOT parity. A local stack that silently skipped
  # every auth test would also report all-green — that is the #396 shape, and it
  # is exactly what a migration that failed to apply would look like.
  #
  # Parity is a COUNT match against the last green cloud run before the quota
  # died: run 31048279017, SHA de0f7f0, 2026-08-05T21:21:26Z.
  #
  #   passed 1807 · skipped 194 · flaky 0
  #
  # Those numbers are falsifiable; "it passed" is not. They are recorded in #575
  # because the run's artifacts expire 2026-08-12T22:13Z — after which a mismatch
  # cannot be diffed against anything until the quota refills on 2026-09-02.
  #
  # TWO TIERS, BECAUSE THEY ANSWER DIFFERENT QUESTIONS (#732).
  #
  #   Tier 1 — "did the suite run and pass?"  True on any commit. 24/24 shards,
  #            zero failures, above a floor. This is the gate.
  #   Tier 2 — "does it match the cloud exactly?"  Only interpretable on de0f7f0,
  #            because on any other SHA the test set has moved.
  #
  # They used to be one check, with tier 2's SHA guard placed FIRST — so on every
  # commit that was not the baseline the job exited 0 before asking whether
  # anything had failed. Combined with `|| true` on the Playwright call, that made
  # the entire workflow incapable of failing: run 31447148386 logged
  # `passed 1863 · failed 21` and concluded success.
  parity:
    # STABLE, AND DELIBERATELY NOT A PARITY NAME. This is the aggregate for the
    # whole local lane, and the plan makes it the required context once the lane
    # runs on every PR. Required contexts cannot be renamed without orphaning
    # themselves, and shard names carry the shard count (`chromium 3/6`), so any
    # re-shard would orphan those. Rename it now, while it is free.
    name: E2E (local) result
    needs: [changes, e2e-local]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # MUST REPORT SUCCESS WHEN THERE WAS NOTHING TO RUN (#575 Phase 3).
      #
      # Every step below is gated on the same condition. Without this the job would try to
      # download artifacts that no matrix produced and fail with "no results.json found",
      # so a docs-only PR would be blocked by a required check for having changed only
      # documentation — the exact outcome the unfiltered trigger exists to avoid.
      #
      # Gating the STEPS, not the job: a skipped job reports as `skipped`, and a required
      # check that reports `skipped` never satisfies branch protection. This job must
      # actually run and actually pass.
      - name: Nothing to run — no code changed
        if: needs.changes.outputs.run != 'true'
        run: |
          echo "The diff touches only paths e2e.yml also ignores (docs, markdown, .claude,"
          echo ".specify, features, LICENSE, .gitignore, .vscode)."
          echo "No shards were dispatched, and this check passes on purpose."

      - name: Resolve which commit was actually tested
        if: needs.changes.outputs.run == 'true'
        id: tested
        run: echo "sha=${{ inputs.ref || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v6
        if: needs.changes.outputs.run == 'true'
        with:
          pattern: e2e-local-*
          path: shards

      - name: Total the shards and compare
        if: needs.changes.outputs.run == 'true'
        env:
          # The commit the TESTS ran against — not github.sha, which is the branch
          # carrying this workflow file. Comparing the wrong one would either skip
          # the check on a real parity run or fail every PR against a baseline that
          # does not describe it.
          TESTED_SHA: ${{ steps.tested.outputs.sha }}
        run: |
          set -uo pipefail
          python3 - <<'EOF'
          import json, os, pathlib, sys

          # STALE SINCE THE @hosted SPLIT (#725), and only tier 2 reads it. On the cloud
          # run these numbers describe, all 21 oauth-csrf executions passed; this lane now
          # excludes 18 of them, so a re-run on de0f7f0 would total 1789 passed, not 1807.
          # Tier 2 fires only on that SHA, so this is a note rather than a code change —
          # but anyone who does run that comparison needs the corrected number, and the
          # baseline itself cannot be regenerated (artifacts expired; quota until 09-02).
          BASE = {"passed": 1807, "skipped": 194, "flaky": 0}
          BASE_SHA = "de0f7f080c8d75949e4e6c89fdf66ab7d3da8029"
          # Deliberately well under both the cloud baseline (1807) and the last local
          # run (1894): this is a "did the suite actually run" floor, not a parity
          # number. Parity is tier 2 below.
          #
          # UNCHANGED by the @hosted split (#725), and the reason is worth stating because
          # it is counter-intuitive: the six excluded tests were FAILING locally, so they
          # were counted in `failed`, never in `passed`. Removing them subtracts nothing
          # from this total.
          FLOOR = 1700

          files = sorted(pathlib.Path("shards").rglob("results.json"))
          if not files:
              print("::error::no results.json found — every shard failed before reporting")
              sys.exit(1)

          tot = {"passed": 0, "skipped": 0, "flaky": 0, "failed": 0}

          def walk(suite):
              for spec in suite.get("specs", []):
                  for t in spec.get("tests", []):
                      st = t.get("status")          # expected|skipped|flaky|unexpected
                      if st == "expected":   tot["passed"]  += 1
                      elif st == "skipped":  tot["skipped"] += 1
                      elif st == "flaky":    tot["flaky"]   += 1
                      else:                  tot["failed"]  += 1
              for child in suite.get("suites", []):
                  walk(child)

          for f in files:
              try:
                  data = json.loads(f.read_text())
              except json.JSONDecodeError:
                  print(f"::warning::{f} is not valid JSON — shard produced no usable result")
                  continue
              for s in data.get("suites", []):
                  walk(s)

          print(f"shards reporting: {len(files)}/24")
          print(f"  passed  {tot['passed']:>5}   baseline {BASE['passed']}")
          print(f"  skipped {tot['skipped']:>5}   baseline {BASE['skipped']}")
          print(f"  flaky   {tot['flaky']:>5}   baseline {BASE['flaky']}")
          print(f"  failed  {tot['failed']:>5}")

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a") as fh:
                  fh.write("### E2E local parity\n\n")
                  fh.write("| | local | cloud baseline |\n|---|---|---|\n")
                  for k in ("passed", "skipped", "flaky"):
                      mark = "OK" if tot[k] == BASE[k] else "DIFF"
                      fh.write(f"| {k} | {tot[k]} | {BASE[k]} | {mark} |\n")
                  fh.write(f"| failed | {tot['failed']} | 0 | |\n")

          # ── TIER 1: the always-on gate (#732) ────────────────────────────────
          #
          # True on ANY commit. This used to sit BELOW the baseline-SHA check, so
          # every run on any other SHA hit `sys.exit(0)` and the whole workflow
          # could not fail: run 31447148386 reported `failed 21` and concluded
          # success. The escape hatch was right about ONE thing only — that COUNT
          # parity is uninterpretable off the baseline — and wrong to take
          # "did anything fail" down with it. Those are separate questions, so
          # they are now separate tiers.
          problems = []
          if len(files) != 24:
              problems.append(f"only {len(files)} of 24 shards reported")
          if tot["failed"]:
              problems.append(f"{tot['failed']} test(s) failed")
          # A floor, not an equality: the test set legitimately grows. It catches
          # the shape an equality cannot — a run that goes green by silently
          # executing almost nothing. Per CLAUDE.md's #396 rule this is NEVER
          # lowered to make a run pass; if the suite really shrinks, say why here.
          if tot["passed"] < FLOOR:
              problems.append(
                  f"only {tot['passed']} passed, floor is {FLOOR} — the suite did not "
                  "really run; do not lower the floor to make this green"
              )
          if problems:
              for p in problems:
                  print(f"::error::{p}")
              sys.exit(1)

          # ── TIER 2: count parity, only interpretable on the baseline SHA ──────
          on_baseline = os.environ.get("TESTED_SHA", "") == BASE_SHA
          if not on_baseline:
              print("")
              print("Gate passed: 24/24 shards, 0 failures, above the floor.")
              print("COUNT PARITY not evaluated — the cloud numbers describe")
              print(f"{BASE_SHA[:8]}; on any other commit the test set has moved and a")
              print("difference is uninterpretable. Re-run on that SHA to decide parity.")
              sys.exit(0)

          bad = [k for k in BASE if tot[k] != BASE[k]]
          if bad:
              print(f"::error::parity MISMATCH on {bad} — do not switch e2e.yml")
              sys.exit(1)
          print("PARITY: local matches the cloud baseline exactly.")
          EOF
