# Post-deploy production @smoke suite (#288, item 2).
#
# #287 proved the whole test suite can be green while the DEPLOYED product is
# unusable (placeholder OAuth client_ids, site_url=localhost, dead SMTP). This
# job hits the LIVE origin AFTER each deploy (and daily) and asserts the deployed
# thing a customer touches works: providers enabled, OAuth authorize redirects
# carry real client_ids (#287 detector), sign-in loads with zero console errors,
# and canonical origin + github.io redirect. (This suite caught a real prod defect
# on its first run — #348, a CSS emitted as <script> — fixed in the same PR.)
#
# All checks are READ-ONLY against prod (no signup / user creation). Like
# conformance.yml it needs no shared-backend mutex — nothing is mutated.

name: Production Smoke

on:
  # Fire AFTER a successful deploy (the missing post-deploy verification).
  workflow_run:
    workflows: ['Deploy to GitHub Pages']
    types: [completed]
  # Daily drift/uptime detection.
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:

# NOTE: no `pull_request` trigger — this is a POST-DEPLOY monitor that tests the
# LIVE origin. A PR's changes aren't deployed yet, so running it on a PR would
# assert against the OLD deploy and red the PR for something it hasn't shipped.
# It runs after Deploy completes (where the PR's changes ARE live), on a daily
# cron, and on demand. Validate suite changes locally or via workflow_dispatch.

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Production @smoke (live origin)
    # Post-deploy runs proceed only if the deploy succeeded; other triggers always run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://scripthammer.com
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs BEFORE the browser suite: it is cheap, and if production is pointed at
      # the wrong backend every test below is meaningless.
      #
      # WHY THIS EXISTS. On 2026-08-07 production served a bundle pointing at a
      # Supabase project that had been DELETED, for hours, behind entirely green
      # checks. The deploy reads `vars.*`; the operator was setting `gh secret set`.
      # Same names, two stores, and secrets are write-only so the divergence was
      # invisible to inspection.
      #
      # Nothing caught it because every check asked the BACKEND whether it was alive.
      # It was — just not the one the bundle called. The only assertion that could
      # have caught it is this one: what the deployed JavaScript actually points at,
      # compared against what we intended to deploy.
      - name: Deployed bundle points at the intended Supabase project
        env:
          SITE: ${{ vars.NEXT_PUBLIC_DEPLOY_URL }}
          WANT: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${WANT:-}" ]; then
            echo "::error::vars.NEXT_PUBLIC_SUPABASE_URL is empty — the build has no backend"
            exit 1
          fi
          html=$(curl -fsS --max-time 30 "${SITE}/pricing/")
          found=""
          for chunk in $(printf '%s' "$html" | grep -oE '/_next/static/chunks/[^"]+\.js' | sort -u); do
            hit=$(curl -fsS --max-time 30 "${SITE}${chunk}" \
                  | grep -oE 'https://[a-z0-9]+\.supabase\.co' | sort -u || true)
            [ -n "$hit" ] && found="$found $hit"
          done
          found=$(printf '%s' "$found" | tr ' ' '\n' | grep -v '^$' | sort -u | tr '\n' ' ')
          echo "intended: $WANT"
          echo "in bundle:$found"
          if [ -z "$found" ]; then
            echo "::error::no Supabase URL found in any deployed chunk — the build shipped without a backend"
            exit 1
          fi
          case " $found " in
            *" $WANT "*) echo "match" ;;
            *) echo "::error::deployed bundle targets$found but vars.NEXT_PUBLIC_SUPABASE_URL is $WANT"; exit 1 ;;
          esac

      - name: Install Playwright (chromium)
        run: |
          for i in 1 2 3; do
            pnpm exec playwright install --with-deps chromium && break
            echo "Retry $i: playwright install failed, retrying in 10s..."
            sleep 10
          done

      - name: Run the production @smoke suite
        run: pnpm test:e2e:smoke
