<?xml version="1.0"?>
<!--
  ScriptHammer wordmark lockup — ring text BAKED TO PATHS. No live text, no
  font dependency. Use at 256px and above; below that the ring is illegible and
  public/scripthammer-logo.svg (text-free) is the correct asset.

  DERIVED from docs/design/brand-marks/scripthammer-lockup.svg by
  docs/design/brand-marks/tools/outline-ring-text.py. Everything except the
  cut-word mask is byte-identical to that source.

  HOW, AND WHY NOT THE OBVIOUS WAY: export/README.txt says to outline this in
  Illustrator/Figma/Inkscape. Inkscape 1.2.2 does NOT work — it converts the
  letterforms but discards the textPath placement, so all 32 glyphs collapse to
  their own local origin off-canvas. Measured against a Chromium+Oswald render
  it scored WORSE than having no font at all (7.14% vs 5.51% differing pixels).

  What works is splitting the problem: Chromium already lays the text along the
  arc honouring textLength="300" and lengthAdjust="spacingAndGlyphs", so it is
  asked for each glyph's on-path position and tangent; fontTools supplies the
  outline. Glyph shapes carry the extra k=0.90671 horizontal squeeze that
  spacingAndGlyphs applies (natural advance 330.87u -> 300u).

  FIDELITY, measured at 1024x1024 against Chromium rendering the original with
  Oswald 700 actually loaded:
      this file            1.372% differing / 0.682% strong
      inkscape attempt     7.140% / 6.842%
      no font at all       5.509% / 4.902%
      identical control    0.000% / 0.000%
  The residual is a ~1px outline around each glyph — antialiasing, not
  displacement. The diff map shows hairlines, never filled letterforms.

  Font: Oswald (SIL OFL 1.1), google/fonts ofl/oswald, variable font instanced
  at wght=700 with fonttools varLib.instancer.
-->
