<!--
  ScriptHammer gear — TEXT-FREE. Never add a live text element to this file.

  DERIVED, not drawn, from docs/design/brand-marks/scripthammer-gear.svg
  (Claude Design "ScriptHammer Logo v3", panel 8a). Two deletions, no path data
  altered:

    1. dropped the "cut-word" mask and its ring-top / ring-bot guide paths
    2. dropped mask="url(#cut-word)" from the steel gear <use>

  WHY NO WORDMARK: the source cuts "SCRIPTHAMMER.COM" out of the ring with live
  textPath glyphs in Oswald 700. Beyond the font dependency, this file renders
  at 30px in the global nav on every page and 56px on sign-in — sizes at which
  ring text is illegible mush. The wordmark version lives in
  public/scripthammer-wordmark.svg for use at 256px and above only.

  The previous file here was a potrace bitmap trace of the old brand with the
  wordmark baked into the centre. Note src/components/game/CogRing/CogRing.tsx
  hand-ports that older geometry for the Three.js scene and has now diverged.
-->
