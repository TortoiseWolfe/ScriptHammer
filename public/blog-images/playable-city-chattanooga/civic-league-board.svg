<svg xmlns="http://www.w3.org/2000/svg" width="860" height="620" viewBox="0 0 860 620" role="img" aria-label="Civic League mockup — a gamified civic-engagement board with a live city score, data vitals, a mission board, and a neighborhood-crew leaderboard">
  <defs>
    <style>
      .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
      .sans { font-family: 'Space Grotesk', system-ui, sans-serif; }
      .lbl  { font-size: 9.5px; letter-spacing: 0.08em; fill: #8b93a7; }
    </style>
  </defs>

  <rect width="860" height="620" fill="#16162a"/>

  <!-- ===== HEADER ===== -->
  <rect x="24" y="22" width="40" height="40" rx="10" fill="#e8d4b8"/>
  <text x="44" y="48" class="mono" font-weight="700" font-size="15" fill="#16162a" text-anchor="middle">CL</text>
  <text x="76" y="42" class="sans" font-weight="700" font-size="20" fill="#e2e8f0">Civic League — Chattanooga</text>
  <text x="76" y="60" class="sans" font-size="11" fill="#8b93a7">You're not the mayor — you're the crew. Real metrics, real moves.</text>
  <rect x="686" y="30" width="150" height="22" rx="6" fill="#1a1a2e" stroke="#2d2d4a"/>
  <text x="761" y="45" class="mono" font-size="10" letter-spacing="0.06em" fill="#8b93a7" text-anchor="middle">SEASON 1 · SUMMER 2026</text>

  <!-- ===== VITALS ROW ===== -->
  <!-- City score -->
  <rect x="24" y="80" width="196" height="88" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
  <text x="38" y="102" class="mono lbl">CITY SCORE</text>
  <text x="38" y="142" class="sans" font-weight="700" font-size="40" fill="#38bdf8">78</text>
  <text x="112" y="142" class="sans" font-size="15" fill="#8b93a7">/100</text>
  <text x="38" y="160" class="sans" font-size="10" fill="#8b93a7">live composite · hover for breakdown</text>

  <!-- metric cards -->
  <g>
    <!-- Data completeness -->
    <rect x="232" y="80" width="140" height="88" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <circle cx="248" cy="100" r="4" fill="#e8d4b8"/>
    <text x="258" y="104" class="mono lbl">COMPLETENESS</text>
    <text x="246" y="134" class="sans" font-weight="700" font-size="22" fill="#e2e8f0">61%</text>
    <text x="246" y="152" class="sans" font-size="9.5" fill="#8b93a7">registry avg · local</text>
    <!-- Air quality -->
    <rect x="384" y="80" width="140" height="88" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <circle cx="400" cy="100" r="4" fill="#22c55e"/>
    <text x="410" y="104" class="mono lbl">AIR QUALITY</text>
    <text x="398" y="134" class="sans" font-weight="700" font-size="22" fill="#e2e8f0">AQI 42</text>
    <text x="398" y="152" class="sans" font-size="9.5" fill="#8b93a7">Open-Meteo · live</text>
    <!-- Transit -->
    <rect x="536" y="80" width="140" height="88" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <circle cx="552" cy="100" r="4" fill="#77a8f9"/>
    <text x="562" y="104" class="mono lbl">TRANSIT</text>
    <text x="550" y="134" class="sans" font-weight="700" font-size="22" fill="#e2e8f0">72%</text>
    <text x="550" y="152" class="sans" font-size="9.5" fill="#8b93a7">sim placeholder</text>
    <!-- Captures -->
    <rect x="688" y="80" width="148" height="88" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <circle cx="704" cy="100" r="4" fill="#e8d4b8"/>
    <text x="714" y="104" class="mono lbl">CAPTURES</text>
    <text x="702" y="134" class="sans" font-weight="700" font-size="22" fill="#e2e8f0">2 / 6</text>
    <text x="702" y="152" class="sans" font-size="9.5" fill="#8b93a7">splat sites · local</text>
  </g>

  <!-- ===== MISSION BOARD (left) ===== -->
  <text x="24" y="200" class="sans" font-weight="700" font-size="14" fill="#e2e8f0">Mission board</text>
  <text x="152" y="200" class="sans" font-size="10.5" fill="#8b93a7">every mission is a real action against a live feed</text>

  <!-- mission card template -->
  <g>
    <!-- 1: MAP -->
    <rect x="24" y="214" width="528" height="118" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <rect x="40" y="230" width="46" height="18" rx="5" fill="#38bdf8"/>
    <text x="63" y="243" class="mono" font-weight="700" font-size="9.5" fill="#16162a" text-anchor="middle">MAP</text>
    <text x="528" y="244" class="mono" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="end">+150</text>
    <text x="40" y="272" class="sans" font-weight="600" font-size="14" fill="#e2e8f0">Height hunter — Market St</text>
    <text x="40" y="292" class="sans" font-size="11.5" fill="#a9b0c0">Tag building heights on 5 amber-height buildings between the Aquarium and MLK.</text>
    <text x="40" y="318" class="sans" font-weight="600" font-size="11" fill="#38bdf8">open registry ›</text>
    <rect x="470" y="304" width="66" height="22" rx="6" fill="#38bdf8"/>
    <text x="503" y="319" class="sans" font-weight="600" font-size="11" fill="#16162a" text-anchor="middle">Claim</text>

    <!-- 2: FIELD -->
    <rect x="24" y="344" width="528" height="118" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <rect x="40" y="360" width="54" height="18" rx="5" fill="#77a8f9"/>
    <text x="67" y="373" class="mono" font-weight="700" font-size="9.5" fill="#16162a" text-anchor="middle">FIELD</text>
    <text x="528" y="374" class="mono" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="end">+250</text>
    <text x="40" y="402" class="sans" font-weight="600" font-size="14" fill="#e2e8f0">Address sweep — MLK Blvd</text>
    <text x="40" y="422" class="sans" font-size="11.5" fill="#a9b0c0">Walk-order sort; verify 20 partial addresses on foot. The amber column is the route sheet.</text>
    <text x="40" y="448" class="sans" font-weight="600" font-size="11" fill="#38bdf8">walk order ›</text>
    <rect x="470" y="434" width="66" height="22" rx="6" fill="#38bdf8"/>
    <text x="503" y="449" class="sans" font-weight="600" font-size="11" fill="#16162a" text-anchor="middle">Claim</text>

    <!-- 3: CAPTURE -->
    <rect x="24" y="474" width="528" height="118" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
    <rect x="40" y="490" width="72" height="18" rx="5" fill="#e8d4b8"/>
    <text x="76" y="503" class="mono" font-weight="700" font-size="9.5" fill="#16162a" text-anchor="middle">CAPTURE</text>
    <text x="528" y="504" class="mono" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="end">+500</text>
    <text x="40" y="532" class="sans" font-weight="600" font-size="14" fill="#e2e8f0">Splat: Walnut St Bridge</text>
    <text x="40" y="552" class="sans" font-size="11.5" fill="#a9b0c0">Two-height orbit, loop closure both ends; RealityScan → Brush → SuperSplat.</text>
    <text x="40" y="578" class="sans" font-weight="600" font-size="11" fill="#38bdf8">site pin in twin ›</text>
    <rect x="470" y="564" width="66" height="22" rx="6" fill="#38bdf8"/>
    <text x="503" y="579" class="sans" font-weight="600" font-size="11" fill="#16162a" text-anchor="middle">Claim</text>
  </g>

  <!-- ===== LEADERBOARD (right) ===== -->
  <rect x="576" y="214" width="260" height="200" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
  <text x="592" y="238" class="mono lbl">SEASON LEADERBOARD</text>
  <g class="sans">
    <text x="592" y="266" class="mono" font-size="11" fill="#6b7385">1</text>
    <text x="612" y="266" font-size="12" font-weight="600" fill="#e2e8f0">North Shore Surveyors</text>
    <text x="820" y="266" class="mono" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="end">1,240</text>
    <text x="592" y="292" class="mono" font-size="11" fill="#6b7385">2</text>
    <text x="612" y="292" font-size="12" font-weight="600" fill="#e2e8f0">Market St Mappers</text>
    <text x="820" y="292" class="mono" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="end">980</text>
    <text x="592" y="318" class="mono" font-size="11" fill="#6b7385">3</text>
    <text x="612" y="318" font-size="12" font-weight="600" fill="#e2e8f0">Southside Signal</text>
    <text x="820" y="318" class="mono" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="end">760</text>
    <!-- your crew (highlighted) -->
    <rect x="586" y="332" width="240" height="26" rx="8" fill="#22304a" stroke="#38bdf8"/>
    <text x="596" y="350" class="mono" font-size="11" fill="#8b93a7">4</text>
    <text x="616" y="350" font-size="12" font-weight="700" fill="#e2e8f0">Your Crew</text>
    <text x="760" y="350" class="mono" font-size="8.5" fill="#8b93a7">LOCAL</text>
    <text x="816" y="350" class="mono" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="end">650</text>
  </g>
  <line x1="592" y1="374" x2="820" y2="374" stroke="#2d2d4a"/>
  <text x="592" y="392" class="sans" font-size="9.5" fill="#8b93a7">City score = completeness 40% + air 20%</text>
  <text x="592" y="405" class="sans" font-size="9.5" fill="#8b93a7">+ transit 20% + landmark captures 20%.</text>

  <!-- scoring note card -->
  <rect x="576" y="424" width="260" height="168" rx="10" fill="#1a1a2e" stroke="#2d2d4a"/>
  <text x="592" y="448" class="mono lbl">HOW A CREW MOVES THE SCORE</text>
  <text x="592" y="472" class="sans" font-size="11" fill="#a9b0c0">Every red cell a crew turns green in</text>
  <text x="592" y="487" class="sans" font-size="11" fill="#a9b0c0">the live building registry lifts the</text>
  <text x="592" y="502" class="sans" font-size="11" fill="#a9b0c0">whole city's number. No invented</text>
  <text x="592" y="517" class="sans" font-size="11" fill="#a9b0c0">figures — each metric carries a</text>
  <text x="592" y="532" class="sans" font-size="11" fill="#a9b0c0">live / sim / local dot.</text>
  <circle cx="598" cy="556" r="4" fill="#22c55e"/><text x="609" y="560" class="sans" font-size="10" fill="#8b93a7">live</text>
  <circle cx="648" cy="556" r="4" fill="#77a8f9"/><text x="659" y="560" class="sans" font-size="10" fill="#8b93a7">sim</text>
  <circle cx="694" cy="556" r="4" fill="#e8d4b8"/><text x="705" y="560" class="sans" font-size="10" fill="#8b93a7">local</text>
</svg>
