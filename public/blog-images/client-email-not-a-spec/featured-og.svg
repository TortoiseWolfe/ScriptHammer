<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Your Client's Email Is Not a Spec — turning mail into tightly-scoped tickets">
  <defs>
    <linearGradient id="ce-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="ce-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ce-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#ce-bg)"/>

  <!-- subtle grid texture -->
  <g opacity="0.06" stroke="#a78bfa" stroke-width="1">
    <path d="M0 158 H1200 M0 316 H1200 M0 474 H1200"/>
    <path d="M240 0 V630 M480 0 V630 M720 0 V630 M960 0 V630"/>
  </g>

  <!-- accent bar -->
  <rect x="90" y="118" width="72" height="8" rx="4" fill="url(#ce-accent)"/>

  <!-- Mail -> arrow -> Ticket motif, top-right -->
  <g transform="translate(830 138)">
    <!-- envelope (loose email) -->
    <g>
      <rect x="0" y="10" width="120" height="84" rx="10" fill="none" stroke="#71717a" stroke-width="6"/>
      <path d="M4 20 L60 60 L116 20" fill="none" stroke="#71717a" stroke-width="6" stroke-linecap="round"/>
      <!-- squiggle = unstructured prose -->
      <path d="M18 74 h84 M18 84 h60" stroke="#52525b" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- arrow -->
    <path d="M140 52 h56" stroke="url(#ce-accent)" stroke-width="7" stroke-linecap="round"/>
    <path d="M186 40 l16 12 l-16 12" fill="none" stroke="url(#ce-accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- ticket (structured) -->
    <g transform="translate(216 4)">
      <rect x="0" y="0" width="108" height="96" rx="10" fill="#1e1b2e" stroke="url(#ce-accent)" stroke-width="6"/>
      <!-- checked acceptance criteria -->
      <g stroke="url(#ce-green)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path d="M18 26 l7 7 l12 -14"/>
        <path d="M18 50 l7 7 l12 -14"/>
        <path d="M18 74 l7 7 l12 -14"/>
      </g>
      <g stroke="#a78bfa" stroke-width="5" stroke-linecap="round">
        <path d="M52 30 h40 M52 54 h40 M52 78 h28"/>
      </g>
    </g>
  </g>

  <!-- Title -->
  <text x="90" y="252" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#fafafa">Your Client's Email</text>
  <text x="90" y="342" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" fill="#fafafa">Is <tspan fill="url(#ce-accent)">Not a Spec</tspan></text>

  <!-- Subtitle -->
  <text x="94" y="414" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="33" font-weight="500" fill="#d4d4d8">An MCP server that turns loose mail into</text>
  <text x="94" y="456" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="33" font-weight="500" fill="#d4d4d8">tightly-scoped GitHub tickets</text>

  <!-- Footer brand + tags -->
  <g font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="90" y="560" font-size="28" font-weight="700" fill="#a78bfa">ScriptHammer</text>
    <text x="368" y="560" font-size="24" font-weight="400" fill="#71717a">the expectations ↔ deliverables contract</text>
  </g>
</svg>
