<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two layers. The truth layer is records.jsonl, 31,030 rows, every one traceable to a byte range in the original HTML. The inference layer is graph.json, guesses capped at 0.85 confidence. Five of the eight questions worth answering came from the records, not the graph.">
  <defs>
    <linearGradient id="tvi-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="400" fill="url(#tvi-bg)" rx="10"/>

  <text x="48" y="54" fill="#fafafa" font-family="Georgia, serif" font-size="27" font-weight="700">Reach for truth first</text>

  <!-- TRUTH LAYER -->
  <rect x="48" y="92" width="524" height="200" rx="10" fill="#27272a" stroke="#60a5fa" stroke-width="2"/>
  <text x="76" y="130" fill="#60a5fa" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">TRUTH LAYER</text>
  <text x="76" y="168" fill="#e4e4e7" font-family="ui-monospace, Menlo, monospace" font-size="21">json/records.jsonl</text>
  <text x="76" y="204" fill="#e4e4e7" font-family="ui-monospace, Menlo, monospace" font-size="32" font-weight="700">31,030</text>
  <text x="76" y="230" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="15">rows, back to 2011</text>
  <text x="76" y="266" fill="#a1a1aa" font-family="Georgia, serif" font-size="16">every row traceable to a byte range</text>

  <!-- INFERENCE LAYER -->
  <rect x="628" y="92" width="524" height="200" rx="10" fill="#27272a" stroke="#52525b" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="656" y="130" fill="#a1a1aa" font-family="ui-monospace, Menlo, monospace" font-size="15" font-weight="700">INFERENCE LAYER</text>
  <text x="656" y="168" fill="#e4e4e7" font-family="ui-monospace, Menlo, monospace" font-size="21">graphify-out/graph.json</text>
  <text x="656" y="204" fill="#a1a1aa" font-family="ui-monospace, Menlo, monospace" font-size="32" font-weight="700">≤ 0.85</text>
  <text x="656" y="230" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="15">confidence, capped on purpose</text>
  <text x="656" y="266" fill="#a1a1aa" font-family="Georgia, serif" font-size="16">good for "who is like whom"</text>

  <!-- the score -->
  <rect x="48" y="316" width="1104" height="52" rx="8" fill="#18181b" stroke="#3f3f46" stroke-width="1"/>
  <text x="76" y="349" fill="#60a5fa" font-family="ui-monospace, Menlo, monospace" font-size="20" font-weight="700">5 of 8</text>
  <text x="168" y="349" fill="#e4e4e7" font-family="Georgia, serif" font-size="17">questions I most wanted answered came from the records, not the graph.</text>
  <text x="1124" y="349" fill="#71717a" font-family="ui-monospace, Menlo, monospace" font-size="15" text-anchor="end">jq, not cypher</text>
</svg>
