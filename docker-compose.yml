# ScriptHammer — Multi-Instance Development Stack
#
# Run two instances side-by-side (A/B testing):
#   Instance A:   docker compose up
#   Instance B:   docker compose -p scripthammer-b up
#
# Host ports auto-assign (see the `:-0` defaults below). Find yours with:
#   docker compose [-p <name>] port scripthammer 3000
#
# Optional Supabase stack:
#   docker compose --profile supabase up
#
# All resources (volumes, networks, containers) are prefixed by the project
# name below. Change COMPOSE_PROJECT_NAME in .env to isolate instances that
# share a checkout directory.

name: ${COMPOSE_PROJECT_NAME:-scripthammer}

# Demo keys from Supabase self-hosting docs — LOCAL DEV ONLY, never deploy.
# https://supabase.com/docs/guides/self-hosting/docker
#
# THESE READ `SUPABASE_LOCAL_*`, NOT `SUPABASE_*`, AND THAT IS THE WHOLE POINT.
# `.env` holds CLOUD credentials, and it sets `SUPABASE_SERVICE_ROLE_KEY`. When
# these lines read that name, the local stack was handed a key signed by the
# CLOUD project's secret while every local service still verified against
# JWT_SECRET below — so the key was rejected by our own PostgREST.
#
# What made it expensive to find is that the failure was SPLIT. `.env` happens
# not to set `SUPABASE_ANON_KEY`, so anon fell through to the working demo
# default; only service-role was poisoned. Anonymous reads worked perfectly and
# every service-role write died with "Invalid authentication credentials" — which
# reads like a broken function, not a broken key. create-order returned a bare
# 500 for exactly this reason.
#
# The keys and the secret are a matched pair: a key is only valid if it was
# signed by JWT_SECRET. Override all three together or none of them.
x-supabase-env: &supabase-env
  JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
  ANON_KEY: ${SUPABASE_LOCAL_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.F_rDxRTPE8OU83L_CNgEGXfmirMXmMMugT29Cvc8ygQ}
  SERVICE_ROLE_KEY: ${SUPABASE_LOCAL_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxNzk5NTM1NjAwfQ.5z-pJI1qwZg1LE5yavGLqum65WOnnaaI5eZ3V00pLww}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}

services:
  # ──────────────────────────────────────────────────────────────────────
  # Next.js app
  # ──────────────────────────────────────────────────────────────────────
  scripthammer:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    # Host port 0 = Docker picks a free one. The prior `:-3000` default was
    # a footgun: two `docker compose up` invocations from the same checkout
    # both resolved to 3000 and collided. 0 means "any instance from this
    # file gets a non-conflicting host port with zero config." Pin a port by
    # setting SH_PORT=3000 in .env — that's opt-in per instance, not
    # mandatory per collision.
    #
    # Discover where you landed:
    #   docker compose port scripthammer 3000   → 127.0.0.1:49171 (or wherever)
    ports:
      - '127.0.0.1:${SH_PORT:-0}:3000'
      - '127.0.0.1:${SH_STORYBOOK_PORT:-0}:6006'
      - '127.0.0.1:${SH_HMR_PORT:-0}:24678'
    # Lets in-container Chromium (Playwright) reach the HOST's published local
    # Supabase Kong port via http://host.docker.internal:54321 when using
    # `pnpm run use:local`. Docker Desktop/WSL provide this automatically;
    # this mapping makes it work on plain Linux Docker too. See #121.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next
      # There is deliberately NO second distDir volume here any more (#508).
      # `pnpm run test:e2e:live` used to build inside THIS container with
      # NEXT_DIST_DIR pointed at a `next_acceptance` volume; an isolated distDir
      # was not enough and the build still died six times in two days. It now
      # runs in the `builder` service below, so there is no second build in this
      # container to isolate.
    env_file:
      - .env
    environment:
      - CI=true
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL}
    healthcheck:
      # basePath-aware; reads NEXT_PUBLIC_BASE_PATH at exec time. See #230.
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 30s
      timeout: 10s # > the script's internal curl --max-time 8
      # 6 × 30s = 3 min of consecutive fails before "unhealthy" — outlasts
      # one self-heal cycle (~60s detect + ~90s recompile), so a normal
      # recovery never flips the container unhealthy.
      retries: 6
      start_period: 180s # pnpm install + first-route cold compile on WSL2
    init: true
    restart: unless-stopped

  # ──────────────────────────────────────────────────────────────────────
  # Production builds — one container, one concern (#293)
  #
  # A production build must never run inside the dev-server container. Both
  # `next dev` and `next build` own /app/.next; when validate-ci.sh reached in
  # with `docker compose exec ... pnpm build`, the build clobbered the dev
  # server's .next and every route 500'd. The escape hatch (NEXT_DIST_DIR in
  # next.config.ts) only ever papered over that — it needs threading through
  # every call site, forever, and one miss brings the outage back.
  #
  # #508 is what one miss looks like. e2e-live-acceptance.sh DID thread it
  # through, onto its own named volume, and the build still died six times in
  # two days with `Cannot find module './6048.js'` — so the escape hatch is not
  # merely fragile, it is insufficient. That script now runs here too, and
  # tests/unit/no-build-in-dev-container.test.ts fails the build if a call site
  # goes back to `docker compose exec … build`.
  #
  # A separate container makes the collision structurally impossible instead:
  # same image, same source, but its OWN .next volume. Nothing to remember.
  #
  # Uses `target: dev`, NOT a dedicated build stage: the former `builder`/`runner`
  # production stages were REMOVED in #275 (output:'export' never emits
  # .next/standalone, so the standalone `runner` could never build). We run the
  # dev toolchain against the live bind mount and build via `pnpm build` below.
  #
  # `profiles:` is required, not cosmetic: without it `docker compose up` would
  # start this service too, and it inherits CMD ["pnpm","run","dev"] from the
  # image — a second dev server fighting over the same ports.
  #
  #   docker compose run --rm builder pnpm build
  #
  # out/ still lands on the bind mount, so `serve out` (Playwright, pa11y) and
  # check-chunks-parse.mjs keep working exactly as they do in CI.
  builder:
    profiles: ['build']
    # PID1 init (#275 SIGNAL_HANDLING). Compose's `init: true` is the
    # `docker run --init` route the audit named as the alternative to adding
    # tini to the Dockerfile. One-shot service, but without it a Ctrl-C
    # mid-build orphans the child processes `pnpm build` spawned.
    init: true
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      # NOT next_cache — that volume is the dev server's. This is the whole
      # point of the service. /app/.next is pre-created node-owned in the image
      # (docker/Dockerfile, the chown -R node:node step), so this volume
      # inherits that ownership.
      - builder_next:/app/.next
    env_file:
      - .env
    environment:
      - CI=true

  # ──────────────────────────────────────────────────────────────────────
  # Supabase — optional local stack (profile: supabase)
  #
  # When active, set in .env:
  #   NEXT_PUBLIC_SUPABASE_URL=http://supabase-kong:8000
  #   NEXT_PUBLIC_SUPABASE_ANON_KEY=<demo anon key above>
  # ──────────────────────────────────────────────────────────────────────

  supabase-db:
    profiles: [supabase]
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SH_DB_PORT:-54322}:5432'
    environment:
      <<: *supabase-env
      POSTGRES_HOST: /var/run/postgresql
      POSTGRES_PORT: 5432
      PGPORT: 5432
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
      # Password for the least-privilege dotnet_app role (#321). roles.sql reads
      # this to set the role's password; defaults to POSTGRES_PASSWORD so local
      # dev is unchanged. Prod injects a DISTINCT value here AND in the
      # dotnet-messaging connection string (both source the same var, so they
      # can't drift). The .NET backend refuses to boot outside Development if
      # this is left at the demo default.
      DOTNET_DB_PASSWORD: ${DOTNET_DB_PASSWORD:-${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - log_min_messages=fatal
    volumes:
      - supabase_db:/var/lib/postgresql/data
      # /etc/postgresql.schema.sql is a hard-coded postinit hook inside the
      # supabase/postgres image -- migrate.sh runs it as supabase_admin after
      # everything else. Role passwords + _realtime schema + auth ownership.
      # Without this file, auth/rest/realtime/storage all crash-loop on a
      # fresh volume. See the header of roles.sql for the gory details.
      - ./docker/supabase/roles.sql:/etc/postgresql.schema.sql:ro
      # Mount the monolithic as a FILE, not the whole ./supabase/migrations/
      # dir. Two separate bugs fixed by this one line:
      #
      #  (1) A directory bind mount SHADOWS the 38 migrations the image bakes
      #      into /docker-entrypoint-initdb.d/migrations/ -- demote-postgres,
      #      create-realtime-schema, update-auth-owner, pg_graphql, vault,
      #      all of it. With those shadowed, GoTrue can't CREATE OR REPLACE
      #      auth.uid() (42501 not owner) and Realtime has no schema at all
      #      (3F000). This profile could never have worked.
      #
      #  (2) The host dir also holds 00000000000000_rls_foundation.sql
      #      (creates on_auth_user_created first -> monolithic :421 re-creates
      #      it and crashes), 999_drop_all_tables.sql (header: "WARNING: This
      #      script will DELETE EVERYTHING"), and seed-test-user-b.sql.
      #      migrate.sh globs migrations/*.sql alphabetically with
      #      ON_ERROR_STOP=1; the first error poisons the volume.
      #
      # 99999999999999_ sorts after the last baked migration (20250312...).
      # App schema lands AFTER platform bootstrap, not in the middle of it.
      - ./supabase/migrations/20251006_complete_monolithic_setup.sql:/docker-entrypoint-initdb.d/migrations/99999999999999_app_monolithic.sql:ro
      - ./supabase/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'postgres', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  supabase-kong:
    profiles: [supabase]
    image: kong:2.8.1
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    ports:
      - '127.0.0.1:${SH_SUPABASE_API_PORT:-54321}:8000'
    environment:
      <<: *supabase-env
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,basic-auth
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      DASHBOARD_USERNAME: ${SUPABASE_DASHBOARD_USER:-supabase}
      DASHBOARD_PASSWORD: ${SUPABASE_DASHBOARD_PASS:-this_password_is_insecure_and_should_be_updated}
    volumes:
      - ./docker/supabase/kong.yml:/home/kong/kong.tpl.yml:ro
    entrypoint: >
      sh -c '
        set -e
        eval "echo \"$$(cat /home/kong/kong.tpl.yml)\"" > /home/kong/kong.yml
        exec /docker-entrypoint.sh kong docker-start
      '

  supabase-auth:
    profiles: [supabase]
    image: supabase/gotrue:v2.177.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      <<: *supabase-env
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:${SH_SUPABASE_API_PORT:-54321}
      GOTRUE_SITE_URL: http://localhost:${SH_PORT:-3000}
      GOTRUE_URI_ALLOW_LIST: '*'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@supabase-db:5432/postgres
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      # Guest checkout (#557/#558). supabase/config.toml also carries this, but
      # that file is read ONLY by the Supabase CLI — which this repo does not and
      # by policy cannot install — so THIS is the setting that actually does
      # anything for the local stack. Without it signInAnonymously() returns 422
      # anonymous_provider_disabled and no guest can buy.
      #
      # Not enabled in production yet: anonymous sessions raise MAU, one of the
      # three quotas at 402 until the cycle resets.
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'true'
      # Default 'true' = normal local dev auto-confirms (fast, no email step).
      # The signup-mailer E2E (#288) sets GOTRUE_MAILER_AUTOCONFIRM=false so GoTrue
      # sends a REAL confirmation email into supabase-mail (Mailpit) that the test
      # reads + clicks — exercising the mailer path that broke undetected in #287.
      GOTRUE_MAILER_AUTOCONFIRM: ${GOTRUE_MAILER_AUTOCONFIRM:-true}
      # GoTrue builds email links as {API_EXTERNAL_URL}{URLPATH}. API_EXTERNAL_URL
      # points at Kong (54321), which only routes /auth/v1/* — so the paths MUST be
      # prefixed /auth/v1, else the emailed link 404s at Kong. GoTrue's default is a
      # bare /verify (would break); pin them (matches the official Supabase stack).
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_SMTP_HOST: supabase-mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: admin@example.com
      GOTRUE_SMTP_SENDER_NAME: Supabase
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_SMS_AUTOCONFIRM: 'true'
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:9999/health',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  supabase-rest:
    profiles: [supabase]
    image: postgrest/postgrest:v12.2.12
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@supabase-db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  supabase-realtime:
    profiles: [supabase]
    image: supabase/realtime:v2.34.47
    restart: unless-stopped
    # THE HOSTNAME IS THE TENANT (#575). Realtime is multi-tenant and resolves the
    # tenant from the FIRST LABEL of the request Host header. Kong used to proxy to
    # `http://supabase-realtime:4000`, a single-label host with no tenant in it, so
    # every socket join failed to resolve `realtime-dev` no matter what was seeded.
    # Upstream's own compose names the container this way for exactly this reason;
    # kong.yml points at the same name.
    #
    # NOTE `container_name` is GLOBAL, not namespaced by COMPOSE_PROJECT_NAME — two
    # checkouts running the `supabase` profile at once will collide on it. That is
    # upstream's design, and this profile is only up during local-Supabase work.
    container_name: realtime-dev.supabase-realtime
    depends_on:
      supabase-db:
        condition: service_healthy
    # NOTHING RAN THE MIGRATIONS. The image's default entrypoint starts the server
    # only; without this, `_realtime.tenants` is never created and the `realtime-dev`
    # tenant `SEED_SELF_HOST` promises is never inserted — so the healthcheck below
    # 404s and ~18 realtime specs fail with a connection that never joins.
    command: >-
      sh -c "/app/bin/migrate &&
             /app/bin/realtime eval 'Realtime.Release.seeds(Realtime.Repo)' &&
             /app/bin/server"
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: 'SET search_path TO _realtime'
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      SECRET_KEY_BASE: ${SUPABASE_REALTIME_SECRET:-0123456789012345678901234567890123456789012345678901234567890123}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: '10000'
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
    # THE ANON KEY HERE MUST BE SIGNED WITH *THIS* REPO'S JWT SECRET (#575). Two
    # different demo keys were pasted into this file: the one below matches
    # `super-secret-jwt-token-…`, which is what all seven services default to; the
    # one that used to be here was upstream Supabase's, signed with
    # `your-super-secret-jwt-token-…`. It never validated, so this healthcheck
    # returned 403 forever and the container stayed `unhealthy` even with the tenant
    # correctly seeded. Verified by recomputing both HMACs.
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-sSfL',
          '--head',
          '-o',
          '/dev/null',
          'http://localhost:4000/api/tenants/realtime-dev/health',
          '-H',
          'Authorization: Bearer ${SUPABASE_LOCAL_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.F_rDxRTPE8OU83L_CNgEGXfmirMXmMMugT29Cvc8ygQ}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  supabase-storage:
    profiles: [supabase]
    image: supabase/storage-api:v1.25.7
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    environment:
      <<: *supabase-env
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@supabase-db:5432/postgres
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
      ENABLE_IMAGE_TRANSFORMATION: 'false'
    volumes:
      - supabase_storage:/var/lib/storage
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--no-verbose',
          '--tries=1',
          '--spider',
          'http://localhost:5000/status',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────────────
  # Edge Functions runtime
  #
  # THE TENTH LEG. This stack was assembled without it, so `POST
  # /functions/v1/<name>` 404'd locally while the same call worked in production
  # — every Edge Function was untestable except by deploying it. The
  # `[edge_runtime]` block in supabase/config.toml does NOT cover this: that file
  # is read only by the Supabase CLI, which this repo does not (and by policy
  # cannot) install.
  #
  # Needs the Kong route in docker/supabase/kong.yml to be reachable; the
  # container alone is not enough.
  # ──────────────────────────────────────────────────────────────────────
  supabase-edge-runtime:
    profiles: [supabase]
    image: supabase/edge-runtime:v1.67.4
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    volumes:
      # Read-only: a function must never be able to rewrite itself at runtime.
      - ./supabase/functions:/home/deno/functions:ro
      # The router lives outside supabase/functions/ so that directory stays
      # exactly the set of deployable functions. See its header for why.
      - ./docker/supabase/edge-main:/home/deno/main:ro
    environment:
      <<: *supabase-env
      # Functions reach the rest of the stack THROUGH Kong, exactly as they do in
      # production — so auth, RLS and the service-role path are exercised for
      # real rather than short-circuited to Postgres.
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_ANON_KEY: ${SUPABASE_LOCAL_ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlLWRlbW8iLCJpYXQiOjE2NDE3NjkyMDAsImV4cCI6MTc5OTUzNTYwMH0.F_rDxRTPE8OU83L_CNgEGXfmirMXmMMugT29Cvc8ygQ}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_LOCAL_SERVICE_ROLE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoic2VydmljZV9yb2xlIiwiaXNzIjoic3VwYWJhc2UtZGVtbyIsImlhdCI6MTY0MTc2OTIwMCwiZXhwIjoxNzk5NTM1NjAwfQ.5z-pJI1qwZg1LE5yavGLqum65WOnnaaI5eZ3V00pLww}
      SUPABASE_DB_URL: postgres://postgres:${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}@supabase-db:5432/postgres
      # _shared/cors.ts derives its allowed origins from this, and the checkout
      # functions build redirect URLs from it.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # JWT verification happens INSIDE each function via
      # _shared/auth.ts::getAuthenticatedUserId, which returns the user id rather
      # than merely asserting a valid token. Letting the runtime reject first
      # would mask the 401-vs-403 distinction those functions are careful about.
      VERIFY_JWT: 'false'
      # Provider secrets. Absent by default — a function that needs Stripe will
      # say so plainly instead of the stack refusing to start.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
    command: ['start', '--main-service', '/home/deno/main']

  supabase-meta:
    profiles: [supabase]
    image: supabase/postgres-meta:v0.91.0
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: supabase_admin
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}

  supabase-studio:
