    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'

  # ──────────────────────────────────────────────────────────────────────
  # SpecKit — Docker-first wrapper for the Python `specify` CLI.
  #
  # Invoked exclusively via `./specify <args>` (see ./specify wrapper).
  # Never started with `docker compose up` — the service has no long-running
  # process. It runs one-shot via `docker compose run --rm speckit ...`.
  #
  # State persistence (bind-mounted host dirs — inherit the host user's UID,
  # so no root-owned-file cleanup dance):
  #   - ./.speckit-tools holds uv's tool install (UV_TOOL_DIR) so `specify`
  #     survives across `--rm` container teardowns.
  #   - ./.speckit-cache holds uv's download cache so subsequent `./specify
  #     update` runs don't re-fetch specify-cli from scratch.
  #   - The repo itself is bind-mounted at /workspace; the CLI acts on it
  #     in-place.
  # ──────────────────────────────────────────────────────────────────────
  speckit:
    profiles: ['speckit']
    # Non-slim image ships git, which `uv tool install ... --from git+https://…`
    # requires when fetching specify-cli. Avoids an apt-get step that would
    # otherwise need root inside the container.
    image: python:3.12
    working_dir: /workspace
    # Run as the host user so files written into the mounted repo (e.g.
    # .specify/extensions/, .claude/skills/, wireframe-config.yml) don't
    # end up root-owned and unreadable to the host-side editor.
    # The ./specify wrapper exports UID/GID from `id -u`/`id -g`.
    user: '${SPECKIT_UID:-1000}:${SPECKIT_GID:-1000}'
    volumes:
      - .:/workspace
      # Tool + cache dirs are bind-mounted from the repo root (gitignored) so
      # they inherit the host user's UID automatically — avoids the classic
      # "named volume is root-owned, non-root container can't write" trap.
      - ./.speckit-tools:/speckit/tools
      - ./.speckit-cache:/speckit/cache
    environment:
      # uv tool install target (writable by non-root user) + PATH entry.
      - UV_TOOL_DIR=/speckit/tools
      - UV_TOOL_BIN_DIR=/speckit/tools/bin
      - UV_CACHE_DIR=/speckit/cache
      - PATH=/speckit/tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - HOME=/tmp
      - GIT_AUTHOR_NAME
      - GIT_AUTHOR_EMAIL
      - GIT_COMMITTER_NAME=${GIT_AUTHOR_NAME}
      - GIT_COMMITTER_EMAIL=${GIT_AUTHOR_EMAIL}

  # ──────────────────────────────────────────────────────────────────────
  # .NET messaging backend (profile: dotnet) — #266/#265 enterprise arc.
  #   An ASP.NET Core + EF Core alternative API over the SAME messaging tables
  #   (points at supabase-db). Flip NEXT_PUBLIC_BACKEND_PROVIDER=dotnet +
  #   NEXT_PUBLIC_DOTNET_API_URL=http://localhost:5099 to route messaging
  #   through it. Validates the Supabase JWT (HS256, SUPABASE_JWT_SECRET) and
  #   enforces the 14-clause authorization contract in C# (no in-DB auth.uid()).
  #   "C1–C29" was always a banner, not a list — see AUTHORIZATION-CONTRACT.md.
  #   Run: docker compose --profile supabase --profile dotnet up
  # ──────────────────────────────────────────────────────────────────────
  dotnet-messaging:
    profiles: ['dotnet']
    # PID1 init (#275 SIGNAL_HANDLING). This is the service where it actually
    # matters: a long-running server (`restart: unless-stopped`) with no init
    # reaps no zombies and leaves SIGTERM handling entirely to the runtime.
    # The audit's original target was the prod runner stage, deleted in
    # ebbac6b — but the concern outlived it, and only `scripthammer` had init.
    init: true
    build:
      context: ./dotnet-messaging
      target: dev
    restart: unless-stopped
    ports:
      - '127.0.0.1:${SH_DOTNET_PORT:-5099}:8080'
    # No hard depends_on supabase-db: the DB is chosen by
    # ConnectionStrings__DefaultConnection (local supabase-db by default, or any
    # external Postgres), so the profile works standalone. Run the local stack
    # too when you want the bundled DB:
    #   docker compose --profile supabase --profile dotnet up
    environment:
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_ENVIRONMENT: Development
      DOTNET_WATCH_SUPPRESS_MSBUILD_INCREMENTALISM: '1'
      # Reach the local Supabase Postgres by service DNS (same messaging schema).
      # Connect as the least-privilege dotnet_app role (#321), NOT postgres — so
      # RLS + the #281 trigger are a live backstop. The password sources the SAME
      # DOTNET_DB_PASSWORD var roles.sql uses (which defaults to POSTGRES_PASSWORD),
      # so the connection password and the role's actual password can't drift.
      # Prod injects a distinct DOTNET_DB_PASSWORD; the backend refuses to boot
      # outside Development if it's left at the demo default.
      ConnectionStrings__DefaultConnection: 'Host=supabase-db;Port=5432;Database=postgres;Username=dotnet_app;Password=${DOTNET_DB_PASSWORD:-${POSTGRES_PASSWORD:-your-super-secret-and-long-postgres-password}}'
      # Same HS256 secret GoTrue/PostgREST validate against.
      SUPABASE_JWT_SECRET: ${SUPABASE_LOCAL_JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      CORS_ORIGINS: 'http://localhost:3000,http://localhost:3002,http://127.0.0.1:3002'
    volumes:
      - ./dotnet-messaging:/app
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'wget -q -O- http://localhost:8080/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  node_modules:
    name: '${COMPOSE_PROJECT_NAME:-scripthammer}_node_modules'
  next_cache:
    name: '${COMPOSE_PROJECT_NAME:-scripthammer}_next_cache'
  # The `builder` service's own .next — never the dev server's (#293).
  builder_next:
    name: '${COMPOSE_PROJECT_NAME:-scripthammer}_builder_next'
  supabase_db:
    name: '${COMPOSE_PROJECT_NAME:-scripthammer}_supabase_db'
  supabase_storage:
    name: '${COMPOSE_PROJECT_NAME:-scripthammer}_supabase_storage'
